<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="前線基地">
<meta name="theme-color" content="#141912">
<meta name="format-detection" content="telephone=no">
<title>前線基地コマンダー</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2333402a'/%3E%3Cpath d='M32 9l6.5 14.2 15.5 1.6-11.6 10.4 3.3 15.3L32 42.7 18.3 50.5l3.3-15.3L10 24.8l15.5-1.6z' fill='%23f1c453'/%3E%3C/svg%3E">
<style>
:root{
  color-scheme: dark;
  --bg:#141912; --bg2:#1a2117; --panel:#222a1d; --panel2:#2a3424; --panel3:#35412d; --line:#44523a;
  --text:#eef0e4; --sub:#b0b9a0; --dim:#7f8a72;
  --khaki:#d8c27e; --gold:#f1c453; --good:#7fd17a; --warn:#f0b34a; --bad:#ef6b5b;
  --ally:#5cc0a6; --enemy:#ec6a58; --money:#f1c453; --steel:#a9c3dc; --r:14px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);overscroll-behavior:none;touch-action:manipulation}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
  font-size:15px;line-height:1.45;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
svg{display:block}
.hidden{display:none!important}
b,strong{font-weight:700}
.num{font-variant-numeric:tabular-nums}

/* ===== レイアウト ===== */
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  background:radial-gradient(120% 60% at 50% 0%,#24301e 0%,var(--bg) 60%)}
#top{flex:none;padding:calc(var(--sat) + 8px) 12px 8px;display:flex;align-items:center;gap:8px;
  background:linear-gradient(#1c2418,#161c13);border-bottom:1px solid #2e3828}
.res{display:flex;align-items:center;gap:6px;background:#10150e;border:1px solid #33402b;border-radius:999px;padding:4px 10px 4px 5px;min-width:0;flex:1 1 0}
.res svg{width:22px;height:22px;flex:none}
.res b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:370px){#top{gap:5px;padding-left:8px;padding-right:8px}.res{gap:3px;padding:4px 7px 4px 4px}.res svg{width:18px;height:18px}.res b{font-size:13.5px}
  .stagepill{padding:3px 5px;font-size:11px}.iconbtn{width:32px;height:34px}}
.res.bump b{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.18);color:#fff}}
.stagepill{flex:none;font-size:12px;color:var(--khaki);border:1px solid #4d5a3c;border-radius:8px;padding:3px 7px;white-space:nowrap}
.iconbtn{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:#232c1e;border:1px solid #39462f}
.iconbtn svg{width:20px;height:20px}
.iconbtn{position:relative}
.iconbtn .dot{position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px #151b12;display:none}
.iconbtn .dot.on{display:block}
/* アイテム一覧 */
.itemlist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.item{display:flex;align-items:center;gap:10px;padding:10px 12px}
.item .ic{flex:none;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:#1c2417;border:1px solid #3a4830}
.item .ic svg{width:28px;height:28px}
.item.part .ic{background:#241c3a;border-color:#6b55a8}
.item .nm{font-weight:900;font-size:15px}
.item .n{margin-left:auto;font-size:18px;font-weight:900;flex:none}
.item.part .n{color:#e2d2ff}
.item.zero{opacity:.55}
.item .small{line-height:1.45;margin-top:2px}
.item .use{color:var(--khaki)}
.item .pill{margin-top:6px}
.armlink{display:flex;align-items:center;gap:8px;padding:8px 12px}
.armlink svg{width:22px;height:22px;flex:none}
#main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.screen{max-width:520px;margin:0 auto;padding:12px 16px 24px}
#tabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:#151b12;border-top:1px solid #2e3828;padding-bottom:var(--sab)}
#tabs button{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0 6px;color:var(--dim);font-size:12px;font-weight:700;min-height:54px}
#tabs button svg{width:26px;height:26px}
#tabs button.on{color:var(--gold)}
#tabs button.on::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
#tabs .dot{position:absolute;top:6px;left:calc(50% + 10px);width:9px;height:9px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px #151b12;display:none}
#tabs .dot.on{display:block}

/* ===== 共通部品 ===== */
h2.sec{font-size:13px;color:var(--khaki);letter-spacing:.12em;margin:18px 0 8px;display:flex;align-items:center;gap:8px}
h2.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,#4a5839,transparent)}
.card{background:var(--panel);border:1px solid #34402c;border-radius:var(--r);padding:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 16px;border-radius:12px;font-weight:800;font-size:15px;
  background:linear-gradient(#e9c65b,#c99a2e);color:#2a2008;box-shadow:0 3px 0 #8a6618,0 6px 14px rgba(0,0,0,.35);transition:transform .08s}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #8a6618}
.btn.sub{background:linear-gradient(#45533a,#36422d);color:var(--text);box-shadow:0 3px 0 #222b1c}
.btn.red{background:linear-gradient(#e06a55,#b8432f);color:#fff;box-shadow:0 3px 0 #7a2618}
.btn.green{background:linear-gradient(#86d27d,#4fa553);color:#0f250f;box-shadow:0 3px 0 #2e6b31}
.btn:disabled{background:#2f382a;color:#7b8570;box-shadow:none}
.btn.wide{width:100%}
.btn.big{min-height:58px;font-size:19px;letter-spacing:.08em}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#33402b;color:var(--khaki);white-space:nowrap}
.pill.red{background:#4a2420;color:#ffb3a6}
.pill.blue{background:#1f3a44;color:#a8e3f2}
.pill.gold{background:#4a3c14;color:var(--gold)}
.small{font-size:12px;color:var(--sub)}
.cost{display:inline-flex;align-items:center;gap:3px;font-weight:700;white-space:nowrap}
.cost svg{width:16px;height:16px}
.cost.short{color:var(--bad)}
.bar{height:8px;border-radius:99px;background:#11160f;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#5fb85a,#9be07a)}

/* ===== 基地 ===== */
.hint{display:flex;gap:10px;align-items:flex-start;background:linear-gradient(90deg,#2d3a24,#232c1e);border:1px solid #4a5a3a;border-radius:12px;padding:10px 12px;font-size:13px}
.hint .tag{flex:none;font-size:10px;font-weight:800;color:#1b2210;background:var(--khaki);border-radius:5px;padding:2px 5px;margin-top:1px}
.collect{margin-top:10px;display:flex;align-items:center;gap:10px}
.collect .info{flex:1;min-width:0;font-size:12px;color:var(--sub)}
.collect .info b{color:var(--text);font-size:14px}
.grid{margin-top:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px;border-radius:18px;
  background:
    repeating-linear-gradient(45deg,rgba(255,255,255,.015) 0 6px,transparent 6px 12px),
    radial-gradient(circle at 50% 50%,#3d4a2c,#2a3420 70%);
  border:2px solid #4d5a3a;box-shadow:inset 0 0 30px rgba(0,0,0,.45)}
.tile{position:relative;aspect-ratio:1/1;border-radius:12px;background:linear-gradient(#4b5a35,#3a4629);border:1px solid #5b6b42;
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),0 3px 6px rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;padding:4px}
.tile:active{transform:scale(.97)}
.tile.hq{background:linear-gradient(#5d5a36,#463f25);border-color:#8a7a45}
.tile.empty{background:rgba(20,26,16,.45);border:2px dashed #5b6b42;box-shadow:none;color:#9aa985}
.tile.empty .plus{font-size:30px;line-height:1;font-weight:300}
.tile.empty .lbl{font-size:11px;font-weight:700}
.tile .art{width:66%;height:auto;flex:none}
.tile .nm{font-size:11px;font-weight:800;text-shadow:0 1px 2px #000;white-space:nowrap;line-height:1.2}
.tile .lv{position:absolute;left:5px;top:5px;font-size:10px;font-weight:800;background:rgba(0,0,0,.55);border-radius:6px;padding:1px 5px;color:var(--khaki)}
.tile .up{position:absolute;right:5px;top:5px;width:20px;height:20px;border-radius:50%;background:var(--good);color:#0d240c;display:grid;place-items:center;font-size:13px;font-weight:900;box-shadow:0 0 0 2px rgba(0,0,0,.3);animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(1.15)}}
.tile .store{position:absolute;left:4px;right:4px;bottom:4px;height:5px;border-radius:9px;background:rgba(0,0,0,.45);overflow:hidden}
.tile .store i{display:block;height:100%;background:var(--gold)}
.tile .store.steel i{background:var(--steel)}
.tile .bub{position:absolute;right:4px;top:4px;display:flex;align-items:center;gap:2px;background:rgba(0,0,0,.6);border-radius:8px;padding:1px 5px 1px 2px;font-size:10px;font-weight:800}
.tile .bub svg{width:13px;height:13px}
.tile .bub.full{background:#6b2c1c;animation:pulse 1.2s infinite}
.basestats{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.basestats .card{padding:9px 11px}
.basestats .k{font-size:11px;color:var(--sub)}
.basestats .v{font-size:16px;font-weight:800}

/* ===== シート・モーダル ===== */
#sheetWrap,#modalWrap{position:fixed;inset:0;z-index:50}
#modalWrap{z-index:70}
.backdrop{position:absolute;inset:0;background:rgba(5,8,4,.62);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:88vh;max-height:88dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  background:linear-gradient(#2a3424,#20281b);border:1px solid #4a5a3a;border-bottom:0;border-radius:20px 20px 0 0;padding:8px 16px calc(var(--sab) + 16px);animation:up .25s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(100%)}}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:#56654a;margin:2px auto 10px}
.sheet h3{margin:0;font-size:19px}
.sheet .close{position:absolute;right:10px;top:10px;width:36px;height:36px;border-radius:50%;background:#1a2116;display:grid;place-items:center;font-size:18px;color:var(--sub)}
.modal{position:absolute;left:16px;right:16px;top:50%;transform:translateY(-50%);max-width:440px;margin:0 auto;max-height:86vh;max-height:86dvh;overflow-y:auto;
  background:linear-gradient(#2c3726,#1f271a);border:1px solid #5a6a46;border-radius:20px;padding:20px 16px 16px;animation:pop .28s cubic-bezier(.2,1.4,.4,1);box-shadow:0 20px 50px rgba(0,0,0,.6)}
@keyframes pop{from{transform:translateY(-50%) scale(.85);opacity:0}}
.bhead{display:flex;gap:12px;align-items:center;padding-right:36px}
.bhead .art{width:72px;height:72px;flex:none;border-radius:14px;background:linear-gradient(#4b5a35,#3a4629);display:grid;place-items:center}
.bhead .art svg{width:60px;height:60px}
.desc{font-size:13px;color:var(--sub);margin:10px 0}
.eff{width:100%;border-collapse:collapse;font-size:13px}
.eff td{padding:7px 4px;border-bottom:1px solid #34402c}
.eff td:first-child{color:var(--sub)}
.eff td.arrow{color:var(--good);font-weight:800;text-align:right;white-space:nowrap}
.eff td.cur{text-align:right;white-space:nowrap}
.costrow{display:flex;gap:14px;justify-content:center;margin:12px 0 10px;font-size:15px}
.costrow .cost svg{width:20px;height:20px}
.reason{text-align:center;font-size:12px;color:var(--warn);margin-top:8px}
.blist{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.bitem{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid #34402c;border-radius:14px;padding:9px}
.bitem .art{width:56px;height:56px;flex:none;border-radius:12px;background:linear-gradient(#4b5a35,#3a4629);display:grid;place-items:center}
.bitem .art svg{width:46px;height:46px}
.bitem .nm{font-weight:800}
.bitem .small{line-height:1.35}
.bitem .btn{min-height:40px;padding:0 12px;font-size:14px;flex:none}
.bitem.locked{opacity:.55}

/* ===== 部隊 ===== */
.ulist{display:flex;flex-direction:column;gap:8px}
.urow{display:flex;gap:10px;align-items:center}
.uicon{width:46px;height:46px;flex:none;border-radius:12px;display:grid;place-items:center;background:#1a2a24;border:1px solid #2f5248}
.uicon svg{width:34px;height:34px}
.uicon.enemy{background:#2c1916;border-color:#5a2c24}
.uicon.off{filter:grayscale(1);opacity:.5}
.stats{display:flex;gap:10px;font-size:12px;color:var(--sub);flex-wrap:wrap}
.stats b{color:var(--text)}
.aff{font-size:11px;margin-top:2px}
.aff .s{color:var(--good)} .aff .w{color:var(--bad)}
.hero{display:flex;gap:12px}
.portrait{width:76px;height:76px;flex:none;border-radius:16px;overflow:hidden;border:2px solid #5a6a46;background:#111}
.portrait svg{width:100%;height:100%}
.portrait.sm{width:40px;height:40px;border-radius:10px;border-width:1px}
.portrait.xs{width:28px;height:28px;border-radius:8px;border-width:1px}
.portrait.locked svg{filter:brightness(0) opacity(.5)}
.hero .nm{font-size:17px;font-weight:800}
.hero .ttl{font-size:11px;color:var(--khaki)}
.skill{margin-top:6px;background:#1a2116;border-radius:10px;padding:6px 8px;font-size:12px}
.skill b{color:var(--gold)}
.mtx{width:100%;border-collapse:separate;border-spacing:3px;font-size:12px;text-align:center}
.mtx th{color:var(--sub);font-weight:700;font-size:11px}
.mtx td{background:#1a2116;border-radius:6px;padding:6px 0;font-weight:800}
.mtx td.s2{background:#24502a;color:#b8ffb0}.mtx td.s1{background:#2b4127;color:#a6e39c}.mtx td.n{color:var(--sub)}.mtx td.w1{background:#4a2a22;color:#ffb6a8}

/* ===== 出撃 ===== */
.stagebar{display:flex;align-items:center;gap:8px}
.stagebar .nav{width:46px;height:46px;flex:none;border-radius:12px;background:#273022;border:1px solid #3d4a33;display:grid;place-items:center;font-size:20px}
.stagebar .nav:disabled{opacity:.3}
.stagebar .mid{flex:1;text-align:center;min-width:0}
.stagebar .sn{font-size:22px;font-weight:900;letter-spacing:.04em}
.stagebar .sp{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side{margin-top:10px;border-radius:16px;padding:10px;border:1px solid}
.side.enemy{background:linear-gradient(#2d1c18,#241714);border-color:#5b2e26}
.side.ally{background:linear-gradient(#1b2a25,#16221d);border-color:#2f5248}
.side .hd{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;margin-bottom:8px}
.side .hd .grow{min-width:0}
.side .pw{font-size:12px;color:var(--sub);font-weight:700}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.slot{position:relative;border-radius:12px;padding:7px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:112px;text-align:center}
.side.enemy .slot{background:#3a221d;border:1px solid #64362c}
.side.ally .slot{background:#203530;border:1px solid #376357}
.side.ally button.slot:active{transform:scale(.96)}
.slot svg.ic{width:38px;height:38px}
.slot .t{font-size:12px;font-weight:800;line-height:1.2}
.slot .p{font-size:11px;color:var(--sub)}
.slot .wk{font-size:10px;color:#ffc7b8;line-height:1.25}
.slot .boss{position:absolute;top:-7px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:900;color:#2a1c00;background:var(--gold);border-radius:6px;padding:0 6px}
.slot.bossc{border-color:var(--gold)!important;box-shadow:0 0 0 1px var(--gold) inset}
.slot .hr{display:flex;align-items:center;gap:3px;font-size:10px;color:var(--khaki);max-width:100%}
.slot .hr span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .hr.none{color:var(--dim)}
.slot .mk{position:absolute;right:4px;top:3px;font-size:13px;font-weight:900}
.mk.g2{color:#8ff08a}.mk.g1{color:#c4e88a}.mk.n{color:#c9c9a8}.mk.b{color:#ff8b78}
.slot.locked{background:rgba(0,0,0,.25)!important;border-style:dashed!important;color:var(--dim);font-size:11px;justify-content:center}
.winbox{margin-top:12px;display:flex;gap:12px;align-items:center}
.wr{flex:none;width:96px;height:96px;border-radius:50%;display:grid;place-items:center;text-align:center;position:relative}
.wr .v{font-size:26px;font-weight:900;line-height:1}
.wr .l{font-size:11px;font-weight:800;margin-top:3px}
.wr .c{position:absolute;inset:0}
.rewards{font-size:13px;display:flex;flex-direction:column;gap:4px}
.rewards .row{gap:12px;flex-wrap:wrap}
.tips{margin-top:8px;font-size:12px;color:var(--sub)}

/* ===== 戦闘 ===== */
#battle{position:fixed;inset:0;z-index:40;background:#0d110b;display:flex;flex-direction:column}
#battle .bsafe{flex:none;height:var(--sat)}
#battle .bcanvas{flex:1;position:relative;min-height:0}
#battle canvas{position:absolute;inset:0;display:block}
#battle .bctl{flex:none;display:flex;gap:8px;align-items:center;padding:8px 12px calc(var(--sab) + 8px);background:#141a11;border-top:1px solid #2b3426}
.speed{display:flex;background:#0d110b;border:1px solid #344029;border-radius:12px;overflow:hidden}
.speed button{width:46px;min-height:44px;font-weight:900;color:var(--dim)}
#bcv{touch-action:none}
.camreset{position:absolute;right:8px;top:70px;z-index:2;min-height:36px;padding:0 12px;border-radius:18px;background:rgba(12,16,10,.85);border:1px solid var(--gold);color:var(--gold);font-size:12px;font-weight:800}
#btnSkip{white-space:nowrap;padding:0 12px}
@media (max-width:380px){
  .speed button{width:40px}
  .autobtn{min-width:54px}
  .skb{gap:3px;padding:4px 4px 6px}
  .skb .portrait.xs{width:22px;height:22px}
  .skb .nm{font-size:10px}
}
.autobtn{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:64px;min-height:44px;border-radius:12px;background:#0d110b;border:1px solid #344029;color:var(--dim);font-weight:900;line-height:1.1}
.autobtn small{font-size:10px}
.autobtn.on{border-color:var(--gold);color:var(--gold);background:#2b2a14}
.skillbar{flex:none;display:flex;gap:6px;padding:6px 10px 0;background:#141a11}
.skb{position:relative;flex:1;min-width:0;display:flex;align-items:center;gap:5px;min-height:50px;padding:4px 6px 6px;border-radius:12px;background:#202a1c;border:1px solid #3a4a30;overflow:hidden;text-align:left}
.skb .portrait{flex:none}
.skb .tx{min-width:0;line-height:1.2}
.skb .nm{display:block;font-size:11px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.skb .st{display:block;font-size:10px;color:var(--sub);white-space:nowrap}
.skb::after{content:"";position:absolute;left:0;bottom:0;height:4px;width:calc(var(--p,0) * 100%);background:linear-gradient(90deg,#c99a2e,#f1c453)}

<script id="logic">
var TF = (function () {
  'use strict';

  // ====== 乱数 ======
  function rngFrom(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hashInt(n) {
    n = (n ^ 61) ^ (n >>> 16);
    n = (n + (n << 3)) | 0;
    n = n ^ (n >>> 4);
    n = Math.imul(n, 0x27d4eb2d);
    n = n ^ (n >>> 15);
    return n >>> 0;
  }

  // ====== 兵種 ======

  // AFF[攻撃側][防御側] = ダメージ倍率
  var AFF = {

    tank: { inf: 1.5,  at: 0.5, tank: 1.0, art: 1.5 },
    at:   { inf: 0.75, at: 0.8, tank: 2.6, art: 0.75 },
    art:  { inf: 1.5,  at: 1.5, tank: 0.6, art: 1.0 }
  };

  var AFF2 = {};
  Object.keys(AFF).forEach(function (a) { AFF2[a] = {}; Object.keys(AFF[a]).forEach(function (d) { AFF2[a][d] = AFF[a][d] * AFF[a][d]; }); });

  // ====== 建物 ======
  // cm/cs: 建設費(資金/鋼材), g: 強化費の伸び

  // ====== テキスト定義 ======
  var BDESC = {
    hq: '基地の中枢。強化すると、ほかの施設のレベル上限と部隊の枠が増える。',

  };
  var SHORT = { inf: '歩兵', at: '対戦車', tank: '戦車', art: '砲兵' };
  var STRONG = { inf: ['at', 'art'], at: ['tank'], tank: ['inf', 'art'], art: ['inf', 'at'] };
  var WEAK = { inf: ['tank'], at: ['inf', 'art', 'at'], tank: ['at'], art: ['tank'] };
  function counters(t) { return TF.TYPES.filter(function (x) { return TF.AFF[x][t] >= 1.5; }); }
  function names(arr) { return arr.map(function (x) { return TF.UNIT[x].name; }).join('・'); }

  // ====== 保存と読み込み ======
  function sanitize(o) {
    var d = TF.newState(now());
    if (!o || typeof o !== 'object' || o.v !== 1) return null;
    var s = {};
    Object.keys(d).forEach(function (k) { s[k] = o[k] !== undefined ? o[k] : d[k]; });
    s.money = +s.money || 0; s.steel = +s.steel || 0;
    if (!s.bld || !s.bld.hq) s.bld = d.bld;
    Object.keys(s.bld).forEach(function (k) {
      if (!TF.BLD[k]) { delete s.bld[k]; return; }
      var b = s.bld[k]; b.lv = Math.max(1, b.lv | 0); b.slot = b.slot | 0;
      if (k === 'supply' || k === 'steel') { b.stored = +b.stored || 0; b.t = +b.t || now(); }
    });
    s.bld.hq.slot = 4;
    if (!s.heroes || !s.heroes.oni) s.heroes = d.heroes;
    Object.keys(s.heroes).forEach(function (k) { if (!TF.HERO[k]) delete s.heroes[k]; });
    s.cleared = Math.max(0, s.cleared | 0);
    s.sel = Math.min(Math.max(1, s.sel | 0), s.cleared + 1);
    s.form = TF.normalizeForm(s, s.form);
    s.stats = s.stats || { battles: 0, wins: 0 };
    if ([1, 2, 4].indexOf(s.speed) < 0) s.speed = 1;
    if (['base', 'army', 'arms', 'sortie'].indexOf(s.tab) < 0) s.tab = 'base';
    s.flags = o.flags || {};
    // 武装(兵器開発)。追加前のデータには、これまでのクリア分の設計図を渡す
    var arms = {};
    TF.TYPES.forEach(function (t) {
      var a = s.arms && s.arms[t];
      if (!a) return;
      arms[t] = {};
      TF.ARM_KINDS.forEach(function (k) { var l = Math.max(0, a[k] | 0); if (l) arms[t][k] = l; });
    });
    s.arms = arms;
    if (o.bp === undefined) {
      var g = 0;
      for (var k = 1; k <= s.cleared; k++) g += TF.stageReward(k).bp;
      s.bp = g;
      if (s.cleared > 0) s.flags.armNew = 1;
    } else s.bp = Math.max(0, +o.bp || 0);
    // 試作部品。追加前のデータには、クリア済みのボス戦の初回分を配る
    var parts = {};
    if (o.parts && typeof o.parts === 'object') Object.keys(o.parts).forEach(function (g) { var n = o.parts[g] | 0; if (+g >= 1 && n > 0) parts[+g] = n; });
    else for (var bs = 10; bs <= s.cleared; bs += 10) parts[TF.partGrade(bs)] = (parts[TF.partGrade(bs)] || 0) + TF.K.partFirst;
    s.parts = parts;
    s.auto = o.auto !== false;
    s.lastSeen = +o.lastSeen || now();
    return s;
  }
  var saveFailed = false;
  function save() {
    if (!st) return;
    st.lastSeen = now();
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(st)); saveFailed = false; }
    catch (e) { if (!saveFailed) { saveFailed = true; toast('保存できませんでした(プライベートブラウズ等)'); } }
  }
  function load() {
    try {
      var raw = localStorage.getItem(SAVE_KEY);
      if (raw) return sanitize(JSON.parse(raw));
    } catch (e) { }
    return null;
  }

  // ====== 画面: 上部 ======
  function renderTop() {
    $('vM').textContent = fmtTop(st.money);
    $('vS').textContent = fmtTop(st.steel);
    $('vStage').textContent = 'ST ' + (st.cleared + 1);
    var anyUp = TF.BLD_ORDER.concat(['hq']).some(function (id) { return TF.lv(st, id) > 0 && TF.canUpgrade(st, id).ok; });
    var info = TF.storedInfo(st, now());
    var full = (info.supply && info.supply.full) || (info.steel && info.steel.full);
    $('dotBase').classList.toggle('on', !!(anyUp || full) && curTab !== 'base');
    $('dotArms').classList.toggle('on', (anyArm() || !!st.flags.armNew) && curTab !== 'arms');
    $('dotItems').classList.toggle('on', !!st.flags.itemNew);
  }

  // ====== 次の目標 ======
  function nextGoal() {
    var L = function (id) { return TF.lv(st, id); };
    if (!L('supply')) return '空き区画をタップして「補給所」を建てよう。資金を自動で生産します。';
    if (st.cleared === 0) return '下の「出撃」からステージ1に挑戦しよう!';
    if (!L('steel')) return '「製鋼所」を建てよう。鋼材を自動で生産します。';
    if (L('barracks') < 3) return '「兵舎」を強化して歩兵を強くしよう。';
    if (L('hq') < 2) return '「司令部」をLv2にすると、部隊の枠が増えて新しい施設が建てられます。';
    if (!L('atpost')) return '「対戦車陣地」を建てよう。対戦車兵は戦車にとても強い!';
    if (!L('factory')) return '「戦車工場」を建てよう。戦車は歩兵と砲兵に強い主力です。';
    if (!L('depot')) return '「倉庫」を建てると、放置で資源が貯まる時間が延びます。';
    if (L('hq') < 3) return '「司令部」をLv3にすると、砲兵陣地と研究所が建てられます。';
    if (!L('artpost')) return '「砲兵陣地」を建てよう。砲兵は歩兵と対戦車兵に強い。';
    if (!L('lab')) return '「研究所」を建てよう。全兵種の強化と、兵器の開発ができるようになります。';
    if (!TF.TYPES.some(function (t) { return TF.ARM_KINDS.some(function (k) { return TF.armLv(st, t, k) > 0; }); })) return '下の「兵器」で武装を開発しよう。設計図は戦闘に勝つと手に入ります。';
    if (TF.slots(st) < 8) return '司令部を強化して部隊の枠を増やそう(現在 ' + TF.slots(st) + '/8)。';
    return '敵の編成を見て相性の良い兵種で挑もう。勝てないときは前のステージで稼いで強化!';
  }

  // ====== 画面: 基地 ======
  function renderBase() {
    var t = now();
    var info = TF.storedInfo(st, t);
    var gm = info.supply ? info.supply.stored : 0, gs = info.steel ? info.steel.stored : 0;
    var html = '<div class="hint"><span class="tag">指令</span><span>' + esc(nextGoal()) + '</span></div>';
    html += '<div class="collect card"><div class="info">貯まっている資源<br><b class="num">' + icoMoneyInline() + '<span id="cM">' + fmt(gm) + '</span></b>  <b class="num">' + icoSteelInline() + '<span id="cS">' + fmt(gs) + '</span></b>' +
      '<br>放置上限 ' + TF.capHours(st) + '時間</div><button class="btn green" id="btnCollect" data-act="collect"' + (gm + gs > 0 ? '' : ' disabled') + '>回収</button></div>';
    html += '<div class="grid" id="grid">';
    var bySlot = {};
    Object.keys(st.bld).forEach(function (k) { bySlot[st.bld[k].slot] = k; });
    for (var i = 0; i < 9; i++) {
      var id = bySlot[i];
      if (!id) {
        html += '<button class="tile empty" data-act="tile" data-slot="' + i + '"><div class="plus">+</div><div class="lbl">建設</div></button>';
        continue;
      }
      var b = st.bld[id];
      var up = TF.canUpgrade(st, id).ok;
      var extra = '';
      if (id === 'supply' || id === 'steel') {
        var si = info[id];
        var pct = si.cap > 0 ? Math.min(100, si.stored / si.cap * 100) : 0;
        extra = '<div class="store' + (id === 'steel' ? ' steel' : '') + '"><i id="bar-' + id + '" style="width:' + pct.toFixed(1) + '%"></i></div>';
        extra += '<div class="bub' + (si.full ? ' full' : '') + (si.stored >= 1 ? '' : ' hidden') + '" id="bub-' + id + '">' + (id === 'supply' ? icoMoney() : icoSteel()) + '<span>' + fmt(si.stored) + '</span></div>';
        up = false;
      }
      html += '<button class="tile' + (id === 'hq' ? ' hq' : '') + '" data-act="tile" data-slot="' + i + '">' + bSvg(id) +
        '<div class="nm">' + TF.BLD[id].name + '</div><div class="lv">Lv' + b.lv + '</div>' + (up ? '<div class="up">↑</div>' : '') + extra + '</button>';
    }
    html += '</div>';
    var power = TF.formSquads(st, st.form).reduce(function (a, q) { return a + q.power; }, 0);
    html += '<div class="basestats">' +
      '<div class="card"><div class="k">部隊の枠</div><div class="v">' + TF.slots(st) + ' / 6</div></div>' +
      '<div class="card"><div class="k">施設の上限レベル</div><div class="v">Lv' + TF.lv(st, 'hq') * 2 + '</div></div>' +
      '<div class="card"><div class="k">編成中の総戦力</div><div class="v num">' + fmt(power) + '</div></div>' +
      '<div class="card"><div class="k">最高到達</div><div class="v">ステージ' + st.cleared + '</div></div></div>';
    $('scr-base').innerHTML = html;
  }
  function icoMoneyInline() { return '<svg viewBox="0 0 24 24" style="display:inline-block;width:15px;height:15px;vertical-align:-2px;margin-right:2px"><use href="#i-money"/></svg>'; }
  function icoSteelInline() { return '<svg viewBox="0 0 24 24" style="display:inline-block;width:15px;height:15px;vertical-align:-2px;margin-right:2px"><use href="#i-steel"/></svg>'; }

  // 生産の表示だけを1秒ごとに更新
  // (要素を作り直すとタップを取りこぼすので、数値と棒だけ書き換える)
  function liveBase() {
    if (curTab !== 'base' || !$('cM')) return;
    var info = TF.storedInfo(st, now());
    var gm = info.supply ? info.supply.stored : 0, gs = info.steel ? info.steel.stored : 0;
    $('cM').textContent = fmt(gm); $('cS').textContent = fmt(gs);
    $('btnCollect').disabled = gm + gs <= 0;
    ['supply', 'steel'].forEach(function (id) {
      var si = info[id], bar = $('bar-' + id), bub = $('bub-' + id);
      if (!si || !bar) return;
      bar.style.width = (si.cap > 0 ? Math.min(100, si.stored / si.cap * 100) : 0).toFixed(1) + '%';
      bub.classList.toggle('hidden', si.stored < 1);
      bub.classList.toggle('full', si.full);
      bub.lastChild.textContent = fmt(si.stored);
    });
  }

  // ====== 施設シート ======
  function effectRows(id, l) {
    var rows = [], cur = l, nx = l + 1;
    function pct(m) { return '×' + m.toFixed(2); }
    if (id === 'hq') {
      rows.push(['部隊の枠', TF.slotsFor(cur), TF.slotsFor(nx) + (TF.slotsFor(nx) >= 6 ? '(最大)' : '')]);
      rows.push(['施設の上限', 'Lv' + cur * 2, 'Lv' + nx * 2]);
    } else if (id === 'supply' || id === 'steel') {
      var nm = id === 'supply' ? '資金' : '鋼材';
      var capH = TF.capHours(st);
      rows.push([nm + 'の生産(1時間)', cur ? fmt(TF.prodRate(id, cur)) : '-', fmt(TF.prodRate(id, nx))]);
      rows.push(['貯蔵の上限(' + capH + '時間分)', cur ? fmt(TF.prodRate(id, cur) * capH) : '-', fmt(TF.prodRate(id, nx) * capH)]);
    } else if (id === 'depot') {
      rows.push(['放置の上限時間', (TF.K.baseCapH + TF.K.depotCapH * cur) + '時間', (TF.K.baseCapH + TF.K.depotCapH * nx) + '時間']);
    } else if (id === 'lab') {
      rows.push(['全兵種の能力', pct(1 + TF.K.labPerLv * cur), pct(1 + TF.K.labPerLv * nx)]);
    } else {
      var t = TF.BLD[id].unit;
      rows.push([TF.UNIT[t].name + 'の能力', cur ? pct(1 + TF.K.unitPerLv * (cur - 1)) : '未解放', pct(1 + TF.K.unitPerLv * (nx - 1))]);
    }
    return rows;
  }
  function unitCardHtml(t) {
    var q = TF.squadStats(st, t, null);
    var on = TF.typeUnlocked(st, t);
    return '<div class="card urow" style="margin-top:8px"><div class="uicon' + (on ? '' : ' off') + '">' + allySvg(t) + '</div><div class="grow">' +
      '<div class="row"><b>' + TF.UNIT[t].name + '</b>' + (on ? '<span class="pill">兵舎系Lv' + TF.lv(st, TF.TYPE_BLD[t]) + '</span>' : '<span class="pill red">未解放</span>') + '</div>' +
      (on ? '<div class="stats"><span>HP <b class="num">' + fmt(q.maxHp) + '</b></span><span>攻撃 <b class="num">' + fmt(q.atk) + '</b></span><span>戦力 <b class="num">' + fmt(q.power) + '</b></span></div>' : '') +
      '<div class="aff"><span class="s">強い: ' + names(STRONG[t]) + '</span> / <span class="w">弱い: ' + names(WEAK[t]) + '</span></div></div></div>';
  }
  function openBuilding(id) {
    var l = TF.lv(st, id), d = TF.BLD[id];
    var chk = TF.canUpgrade(st, id);
    var max = TF.maxLevel(st, id);
    var html = '<div class="grab"></div><button class="close" data-act="sheet-close" aria-label="閉じる">✕</button>';
    html += '<div class="bhead"><div class="art">' + bSvg(id) + '</div><div><h3>' + d.name + '</h3><div class="row" style="margin-top:4px"><span class="pill gold">Lv' + l + '</span><span class="small">上限 Lv' + (id === 'hq' ? '∞' : max) + '</span></div></div></div>';
    html += '<div class="desc">' + BDESC[id] + '</div>';
    if (id === 'supply' || id === 'steel') {
      var si = TF.storedInfo(st, now())[id];
      html += '<div class="card" style="margin-bottom:8px"><div class="row"><span class="grow small">貯まっている' + (id === 'supply' ? '資金' : '鋼材') + '</span><b class="num">' + fmt(si.stored) + ' / ' + fmt(si.cap) + '</b></div><div class="bar" style="margin-top:6px"><i style="width:' + Math.min(100, si.stored / Math.max(1, si.cap) * 100) + '%;' + (id === 'steel' ? 'background:var(--steel)' : 'background:var(--gold)') + '"></i></div>' +
        '<div class="small" style="margin-top:4px">' + (si.full ? '満杯です。回収しましょう!' : 'あと ' + fmtDur((si.cap - si.stored) / si.rate * 3600000) + 'で満杯') + '</div></div>';
    }
    var maxed = id === 'depot' && l >= TF.K.depotMaxLv;
    if (!maxed) {
      html += '<table class="eff">' + effectRows(id, l).map(function (r) { return '<tr><td>' + r[0] + '</td><td class="cur">' + r[1] + '</td><td class="arrow">→ ' + r[2] + '</td></tr>'; }).join('') + '</table>';
    } else {
      html += '<div class="card small">最大レベルです(放置上限 ' + TF.capHours(st) + '時間)。</div>';
    }
    if (id === 'hq') {
      var unl = TF.BLD_ORDER.filter(function (k) { return TF.BLD[k].req === l + 1; });
      if (unl.length) html += '<div class="small" style="margin-top:8px">Lv' + (l + 1) + 'で建設可能: <b style="color:var(--gold)">' + unl.map(function (k) { return TF.BLD[k].name; }).join('・') + '</b></div>';
    }
    if (d.unit) html += unitCardHtml(d.unit);
    if (!maxed) {
      var c = TF.upgradeCost(id, l);
      html += '<div class="costrow">' + costHtml(c) + '</div>';
      html += '<button class="btn wide big" data-act="upgrade" data-id="' + id + '"' + (chk.ok ? '' : ' disabled') + '>強化する Lv' + l + ' → ' + (l + 1) + '</button>';
      if (!chk.ok) html += '<div class="reason">' + esc(chk.reason) + (chk.short ? '(出撃で稼ぐか、生産施設から回収しよう)' : '') + '</div>';
    }
    openSheet(html);

  // ====== 画面: 出撃 ======
  function matchupMark(t, enemies) {
    var dealt = 0, taken = 0;
    enemies.forEach(function (e) { dealt += TF.AFF[t][e.type]; taken += TF.AFF[e.type][t]; });
    var r = dealt / taken;
    if (r >= 1.6) return ['g2', '◎'];
    if (r >= 1.15) return ['g1', '○'];
    if (r >= 0.85) return ['n', '−'];
    return ['b', '×'];
  }
  function wrInfo(w) {
    if (w >= 0.85) return ['楽勝', '#7fd17a'];

    if (w >= 0.4) return ['互角', '#f0c34a'];

  }

    if (wrCache && wrCache.key === key) return wrCache.v;
    var v = TF.predict(st, st.form, st.sel, 100);

    return v;
  }

  // 稼ぎにおすすめのステージ:
  // 「勝てる」= おまかせ編成で予想勝率80%以上 のステージのうち、
  // 1戦あたりの稼ぎ(予想勝率×報酬)がいちばん多いもの。ボス戦は報酬2倍なので、少し前のボス戦が選ばれることもある。
  var FARM_OK = 0.8, farmCache = null;
  function bestFarm() {
    if (st.cleared < 1) return null;
    var key = st.cleared + '|' + JSON.stringify(st.bld, function (k, v) { return k === 'stored' || k === 't' ? undefined : v; }) + '|' + JSON.stringify(st.heroes) + '|' + JSON.stringify(st.arms);
    if (farmCache && farmCache.key === key) return farmCache.v;
    var C = st.cleared, best = null, top = null, n = 0, done = {}, list = [];
    function value(rw) { return rw.m + rw.s * 1.6; }
    function consider(s) {
      if (s < 1 || s > C || done[s]) return null;
      var rw = TF.stageReward(s);
      if (best && value(rw) <= best.inc) return null; // 全勝しても今の候補を超えられない
      done[s] = true; n++;
      var f = TF.autoFormation(st, s, 6);
      var wr = TF.predict(st, f, s, 40).winRate;
      var e = { s: s, wr: wr, inc: wr * value(rw), m: rw.m, st: rw.s };
      list.push(e);
      if (!top || wr > top.wr || (wr === top.wr && e.inc > top.inc)) top = e;
      if (wr >= FARM_OK && (!best || e.inc > best.inc)) best = e;
      return e;
    }
    var s, lo = Math.max(1, C - 11);
    for (s = C; s >= lo; s--) consider(s);
    if (!best) {
      // 直近で勝てるところがなければ、間隔を広げながらさかのぼり、見つかったら手前も調べる
      var fail = lo, back = 16;
      while (!best && C - back >= 1 && n < 26) {
        var e = consider(C - back);
        if (e && e.wr < FARM_OK) fail = C - back;
        back = Math.ceil(back * 1.5);
      }
      if (!best) consider(1);
      if (best) for (s = fail - 1; s > best.s && n < 34; s--) consider(s);
    }
    if (best) {
      // さらに前でも、報酬が今の候補を上回り得るステージ(とくにボス戦)だけ調べる
      for (s = Math.min(lo, best.s) - 1; s >= 1 && n < 42; s--) {
        var nb = Math.floor(s / 10) * 10;
        var bossLeft = nb >= 10 && value(TF.stageReward(nb)) > best.inc;
        if (s % 10 !== 0 && value(TF.stageReward(s)) <= best.inc && !bossLeft) break;
        consider(s);
      }
    }
    // 候補を、出撃画面と同じ計算(おまかせ編成・100回の模擬戦)で確かめてから決める
    function precise(e) {
      e.wr = TF.predict(st, TF.autoFormation(st, e.s), e.s, 100).winRate;
      e.inc = e.wr * value(TF.stageReward(e.s));
      return e;
    }
    var v = null;
    var cands = list.filter(function (e) { return e.wr >= FARM_OK; }).sort(function (a, b) { return b.inc - a.inc; });
    for (var i = 0; i < cands.length && i < 3; i++) {
      if (precise(cands[i]).wr >= FARM_OK) { v = cands[i]; break; }
    }
    if (!v && top) v = precise(top);
    if (v) { v.ok = v.wr >= FARM_OK; v.evals = n; }
    farmCache = { key: key, v: v };
    return v;
  }

  // ====== 戦闘演出 ======

  // 指でなぞると見回し、2本指で拡大・縮小できる。

    var wrap, cv, cx, W = 0, H = 0, DPR = 1;

    var TROOP = { inf: 1500, at: 1200, tank: 800, art: 600 };   // ラベルに出す兵数(ステージが進むと増える)
    var FIGMAX = { inf: 54, at: 36, tank: 6, art: 5 };          // 描く兵士・車両の数
    var FIGSP = { inf: 1.85, at: 2.2, tank: 6.4, art: 7.0 };
    var FIGH = { inf: 2.8, at: 2.8, tank: 4.4, art: 4.2 };
    var FIGW = { inf: 1.8, at: 2.6, tank: 5.8, art: 6.2 };
    var FLIGHT = { inf: 0.18, at: 0.5, tank: 0.26, art: 0.78 };

      { main: '#3fc45c', dark: '#21813a', light: '#a4f5ae', rgb: '70,225,110', icon: '#1b6a2e' },
      { main: '#e5473c', dark: '#9c2820', light: '#ffa496', rgb: '240,80,70', icon: '#8c1f18' }
    ];
    var BIOME = {
      snow: { near: '#e3eaef', far: '#cfd9e1', patch: 'rgba(160,178,196,.22)', furrow: 'rgba(120,140,160,.25)', road: '#a88a6c', roadE: '#86694f', tree: '#2c5a4a', tree2: '#3b7360', cap: '#f7fbff', rock: '#98a4ae', haze: '226,234,240', wall: '#c9c2b4', pond: '#86aec6', shore: '#eef3f6', roofs: ['#7a5a48', '#5f6873', '#6f4f6a'] },
      grass: { near: '#7fa65b', far: '#668c49', patch: 'rgba(40,70,20,.16)', furrow: 'rgba(30,55,15,.22)', road: '#b48e62', roadE: '#8c6a45', tree: '#2d6630', tree2: '#3f8840', cap: null, rock: '#8d9182', haze: '200,220,190', wall: '#d6ccb4', pond: '#5b8db0', shore: '#9cb87a', roofs: ['#8a4f36', '#5d6670', '#7a6a3a'] },
      desert: { near: '#e2c991', far: '#cdb077', patch: 'rgba(150,100,40,.15)', furrow: 'rgba(130,85,35,.2)', road: '#a77a4f', roadE: '#84603c', tree: '#6d7b3a', tree2: '#8a9a48', cap: null, rock: '#a88f6c', haze: '240,225,190', wall: '#d9c7a2', pond: '#5f9fae', shore: '#c9b67a', roofs: ['#b07a4a', '#9a8a6a', '#c49a5a'] }

    }

    // ---- 戦場の広さ ----
    // 7列の広大な戦場。両軍は奥行きのある地形の区画の奥(出撃線)から前線へ進んでくる。
    // 進む速さは地形で変わり(エンジンの到着時刻どおりに動く)、2本指の拡大・縮小で全体を見渡せる
    var CXW = 150, F0 = 150;                              // 戦場の中心(横)と、最初の前線(奥行き)
    var DS = 2;                                           // 奥行きの倍率
    function Yd(y) { return F0 + (y - F0) * DS; }         // もとの奥行きの座標を、深い戦場に合わせて伸ばす
    function X(x) { return (x - 100) * 1.6 + 150; }       // もとの幅200の座標を、広い戦場に合わせて伸ばす
    function WX(x) { return CXW + (x - CXW) * 1.35; }     // 5列のころの地図の横位置を、7列の地図に合わせる
    var MAP = { x0: -260, x1: 560, y0: -190, y1: 520 };   // 地面の広さ

    function laneOfX(x) { var b = 0; for (var i = 1; i < LANES.length; i++) if (Math.abs(x - LANES[i]) < Math.abs(x - LANES[b])) b = i; return b; }

    // 地形の区画(各列の自軍側・敵側)

    var DEP = { x0: LANES[0] - LANEW / 2 + 6, x1: LANES[LANES.length - 1] + LANEW / 2 - 6, y0: advToY(0, TF.K.advMin), y1: advToY(0, TF.K.advMax) };
    function clampDep(x, y) { return { x: Math.max(DEP.x0, Math.min(DEP.x1, x)), y: Math.max(DEP.y0, Math.min(DEP.y1, y)) }; }

    // ---- カメラ(遠近つき・見回し・拡大縮小) ----
    var CAM = { x: CXW, y: F0 + 14, z: 1, th: 0.93, D: 280 };
    var SN = 0, CS = 0, KREF = 1, FP = 1, CY = 0;
    function setupProj() {

    }

    function resize() {

      [cv, bgCanvas].forEach(function (c) {

    // ---- 小さな絵(兵士・戦車・砲)を先に描いておく ----
    function makeSprites() {

      function soldier(g, T, at, side, tier) {

        // 砲身の長さ・太さと砲塔の形は、開発した主砲で変わる(1: 丸い砲塔の短砲身 … 6: くさび形の大口径砲)
        var bl = 1.7 + 0.32 * tier, bw = tier >= 6 ? 0.5 : tier === 2 ? 0.44 : 0.38, boxy = tier === 2 || tier >= 4;

          }),

            g.fillStyle = 'rgba(20,18,15,.45)'; ell(g, 0, -0.5, 2.9, 0.9);
            g.fillStyle = '#3b3833'; g.fillRect(-1.9, -2.6, 3.8, 2.1);
            g.fillStyle = '#26241f'; ell(g, 0.2, -2.0, 1.0, 0.7);

    }

    // ---- 戦場の地図を作る(地面は真上から見た絵、木や家は立てて描く) ----
    var TEXPPU = 3;
    function makeMap() {
      var bio = BIOME[B.biome], rnd = TF.rngFrom(1000 + B.info.s * 31);
      var tw = Math.round((MAP.x1 - MAP.x0) * TEXPPU), th = Math.round((MAP.y1 - MAP.y0) * TEXPPU);
      var c = document.createElement('canvas');
      c.width = tw; c.height = th;
      var g = c.getContext('2d');
      // 世界座標で描けるよう変換(奥=上)
      g.setTransform(TEXPPU, 0, 0, -TEXPPU, -MAP.x0 * TEXPPU, MAP.y1 * TEXPPU);
      g.fillStyle = bio.near; g.fillRect(MAP.x0, MAP.y0, MAP.x1 - MAP.x0, MAP.y1 - MAP.y0);
      var i, j, x, y;
      for (i = 0; i < 200; i++) {
        g.fillStyle = 'rgba(' + (rnd() < 0.5 ? '0,0,0' : '255,250,230') + ',' + (0.03 + rnd() * 0.04) + ')';
        g.beginPath(); g.ellipse(MAP.x0 + rnd() * (MAP.x1 - MAP.x0), MAP.y0 + rnd() * (MAP.y1 - MAP.y0), 8 + rnd() * 40, 5 + rnd() * 24, rnd() * 3, 0, Math.PI * 2); g.fill();
      }
      // 畑・区画
      for (i = 0; i < 170; i++) {
        var fx = MAP.x0 + rnd() * (MAP.x1 - MAP.x0), fy = MAP.y0 + rnd() * (MAP.y1 - MAP.y0), fw = 14 + rnd() * 26, fd = 9 + rnd() * 18, rot = (rnd() - 0.5) * 0.7;
        g.save(); g.translate(fx, fy); g.rotate(rot);

      var g = c.getContext('2d');
      var grd = g.createLinearGradient(0, 0, 0, 180); grd.addColorStop(0, '#3f4f30'); grd.addColorStop(1, '#1f2818');
      g.fillStyle = grd; g.fillRect(0, 0, 180, 180);
      g.fillStyle = '#f1c453'; g.beginPath();
      for (var i = 0; i < 10; i++) { var r = i % 2 ? 30 : 70, a = -Math.PI / 2 + i * Math.PI / 5; g.lineTo(90 + Math.cos(a) * r, 92 + Math.sin(a) * r); }
      g.closePath(); g.fill();
      var l = document.createElement('link'); l.rel = 'apple-touch-icon'; l.href = c.toDataURL('image/png');
      document.head.appendChild(l);
    } catch (e) { }
  }

  // ====== 起動 ======
  function boot() {
    var loaded = load();
    var fresh = !loaded;
    st = loaded || TF.newState(now());
    if (fresh) { st.flags = {}; st.lastSeen = now(); }
    var away = now() - (st.lastSeen || now());
    TF.settle(st, now());
    curTab = st.tab || 'base';
    show(curTab);
    setInterval(function () { liveBase(); renderTop(); }, 1000);
    setInterval(save, 15000);
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) save();
      else { var a = now() - (st.lastSeen || now()); TF.settle(st, now()); render(); if (a > 10 * 60000 && !Battle.active() && $('modalWrap').classList.contains('hidden')) welcomeBack(a); }
    });
    window.addEventListener('pagehide', save);
    makeTouchIcon();
    if (navigator.storage && navigator.storage.persist) { try { navigator.storage.persist(); } catch (e) { } }
    if (st.pending) {
      // 戦闘の途中で閉じた場合は、結果をそのまま反映する
      finishBattle();
    } else if (fresh) {
      intro();
    } else if (away > 10 * 60000) {
      welcomeBack(away);
    }
    save();
  }
  window.__game = { get state() { return st; }, TF: TF, save: save, render: render, battle: Battle, map: MapView, bestFarm: function () { farmCache = null; return bestFarm(); } };
  boot();
})();
</script>
</body>
