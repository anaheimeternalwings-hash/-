<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="前線基地">
<meta name="theme-color" content="#141912">
<meta name="format-detection" content="telephone=no">
<title>前線基地コマンダー</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2333402a'/%3E%3Cpath d='M32 9l6.5 14.2 15.5 1.6-11.6 10.4 3.3 15.3L32 42.7 18.3 50.5l3.3-15.3L10 24.8l15.5-1.6z' fill='%23f1c453'/%3E%3C/svg%3E">
<style>
:root{
  color-scheme: dark;
  --bg:#141912; --bg2:#1a2117; --panel:#222a1d; --panel2:#2a3424; --panel3:#35412d; --line:#44523a;
  --text:#eef0e4; --sub:#b0b9a0; --dim:#7f8a72;
  --khaki:#d8c27e; --gold:#f1c453; --good:#7fd17a; --warn:#f0b34a; --bad:#ef6b5b;
  --ally:#5cc0a6; --enemy:#ec6a58; --money:#f1c453; --steel:#a9c3dc; --r:14px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);overscroll-behavior:none;touch-action:manipulation}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
  font-size:15px;line-height:1.45;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
svg{display:block}
.hidden{display:none!important}
b,strong{font-weight:700}
.num{font-variant-numeric:tabular-nums}

/* ===== レイアウト ===== */
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  background:radial-gradient(120% 60% at 50% 0%,#24301e 0%,var(--bg) 60%)}
#top{flex:none;padding:calc(var(--sat) + 8px) 12px 8px;display:flex;align-items:center;gap:8px;
  background:linear-gradient(#1c2418,#161c13);border-bottom:1px solid #2e3828}
.res{display:flex;align-items:center;gap:6px;background:#10150e;border:1px solid #33402b;border-radius:999px;padding:4px 10px 4px 5px;min-width:0;flex:1 1 0}
.res svg{width:22px;height:22px;flex:none}
.res b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res.bump b{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.18);color:#fff}}
.stagepill{flex:none;font-size:12px;color:var(--khaki);border:1px solid #4d5a3c;border-radius:8px;padding:3px 7px;white-space:nowrap}
.iconbtn{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:#232c1e;border:1px solid #39462f}
.iconbtn svg{width:20px;height:20px}
#main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.screen{max-width:520px;margin:0 auto;padding:12px 16px 24px}
#tabs{flex:none;display:grid;grid-template-columns:repeat(3,1fr);background:#151b12;border-top:1px solid #2e3828;padding-bottom:var(--sab)}
#tabs button{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0 6px;color:var(--dim);font-size:12px;font-weight:700;min-height:54px}
#tabs button svg{width:26px;height:26px}
#tabs button.on{color:var(--gold)}
#tabs button.on::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
#tabs .dot{position:absolute;top:6px;left:calc(50% + 10px);width:9px;height:9px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px #151b12;display:none}
#tabs .dot.on{display:block}

/* ===== 共通部品 ===== */
h2.sec{font-size:13px;color:var(--khaki);letter-spacing:.12em;margin:18px 0 8px;display:flex;align-items:center;gap:8px}
h2.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,#4a5839,transparent)}
.card{background:var(--panel);border:1px solid #34402c;border-radius:var(--r);padding:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 16px;border-radius:12px;font-weight:800;font-size:15px;
  background:linear-gradient(#e9c65b,#c99a2e);color:#2a2008;box-shadow:0 3px 0 #8a6618,0 6px 14px rgba(0,0,0,.35);transition:transform .08s}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #8a6618}
.btn.sub{background:linear-gradient(#45533a,#36422d);color:var(--text);box-shadow:0 3px 0 #222b1c}
.btn.red{background:linear-gradient(#e06a55,#b8432f);color:#fff;box-shadow:0 3px 0 #7a2618}
.btn.green{background:linear-gradient(#86d27d,#4fa553);color:#0f250f;box-shadow:0 3px 0 #2e6b31}
.btn:disabled{background:#2f382a;color:#7b8570;box-shadow:none}
.btn.wide{width:100%}
.btn.big{min-height:58px;font-size:19px;letter-spacing:.08em}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#33402b;color:var(--khaki);white-space:nowrap}
.pill.red{background:#4a2420;color:#ffb3a6}
.pill.blue{background:#1f3a44;color:#a8e3f2}
.pill.gold{background:#4a3c14;color:var(--gold)}
.small{font-size:12px;color:var(--sub)}
.cost{display:inline-flex;align-items:center;gap:3px;font-weight:700;white-space:nowrap}
.cost svg{width:16px;height:16px}
.cost.short{color:var(--bad)}
.bar{height:8px;border-radius:99px;background:#11160f;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#5fb85a,#9be07a)}

/* ===== 基地 ===== */
.hint{display:flex;gap:10px;align-items:flex-start;background:linear-gradient(90deg,#2d3a24,#232c1e);border:1px solid #4a5a3a;border-radius:12px;padding:10px 12px;font-size:13px}
.hint .tag{flex:none;font-size:10px;font-weight:800;color:#1b2210;background:var(--khaki);border-radius:5px;padding:2px 5px;margin-top:1px}
.collect{margin-top:10px;display:flex;align-items:center;gap:10px}
.collect .info{flex:1;min-width:0;font-size:12px;color:var(--sub)}
.collect .info b{color:var(--text);font-size:14px}
.grid{margin-top:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px;border-radius:18px;
  background:
    repeating-linear-gradient(45deg,rgba(255,255,255,.015) 0 6px,transparent 6px 12px),
    radial-gradient(circle at 50% 50%,#3d4a2c,#2a3420 70%);
  border:2px solid #4d5a3a;box-shadow:inset 0 0 30px rgba(0,0,0,.45)}
.tile{position:relative;aspect-ratio:1/1;border-radius:12px;background:linear-gradient(#4b5a35,#3a4629);border:1px solid #5b6b42;
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),0 3px 6px rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;padding:4px}
.tile:active{transform:scale(.97)}
.tile.hq{background:linear-gradient(#5d5a36,#463f25);border-color:#8a7a45}
.tile.empty{background:rgba(20,26,16,.45);border:2px dashed #5b6b42;box-shadow:none;color:#9aa985}
.tile.empty .plus{font-size:30px;line-height:1;font-weight:300}
.tile.empty .lbl{font-size:11px;font-weight:700}
.tile .art{width:66%;height:auto;flex:none}
.tile .nm{font-size:11px;font-weight:800;text-shadow:0 1px 2px #000;white-space:nowrap;line-height:1.2}
.tile .lv{position:absolute;left:5px;top:5px;font-size:10px;font-weight:800;background:rgba(0,0,0,.55);border-radius:6px;padding:1px 5px;color:var(--khaki)}
.tile .up{position:absolute;right:5px;top:5px;width:20px;height:20px;border-radius:50%;background:var(--good);color:#0d240c;display:grid;place-items:center;font-size:13px;font-weight:900;box-shadow:0 0 0 2px rgba(0,0,0,.3);animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(1.15)}}
.tile .store{position:absolute;left:4px;right:4px;bottom:4px;height:5px;border-radius:9px;background:rgba(0,0,0,.45);overflow:hidden}
.tile .store i{display:block;height:100%;background:var(--gold)}
.tile .store.steel i{background:var(--steel)}
.tile .bub{position:absolute;right:4px;top:4px;display:flex;align-items:center;gap:2px;background:rgba(0,0,0,.6);border-radius:8px;padding:1px 5px 1px 2px;font-size:10px;font-weight:800}
.tile .bub svg{width:13px;height:13px}
.tile .bub.full{background:#6b2c1c;animation:pulse 1.2s infinite}
.basestats{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.basestats .card{padding:9px 11px}
.basestats .k{font-size:11px;color:var(--sub)}
.basestats .v{font-size:16px;font-weight:800}

/* ===== シート・モーダル ===== */
#sheetWrap,#modalWrap{position:fixed;inset:0;z-index:50}
#modalWrap{z-index:70}
.backdrop{position:absolute;inset:0;background:rgba(5,8,4,.62);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:88vh;max-height:88dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  background:linear-gradient(#2a3424,#20281b);border:1px solid #4a5a3a;border-bottom:0;border-radius:20px 20px 0 0;padding:8px 16px calc(var(--sab) + 16px);animation:up .25s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(100%)}}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:#56654a;margin:2px auto 10px}
.sheet h3{margin:0;font-size:19px}
.sheet .close{position:absolute;right:10px;top:10px;width:36px;height:36px;border-radius:50%;background:#1a2116;display:grid;place-items:center;font-size:18px;color:var(--sub)}
.modal{position:absolute;left:16px;right:16px;top:50%;transform:translateY(-50%);max-width:440px;margin:0 auto;max-height:86vh;max-height:86dvh;overflow-y:auto;
  background:linear-gradient(#2c3726,#1f271a);border:1px solid #5a6a46;border-radius:20px;padding:20px 16px 16px;animation:pop .28s cubic-bezier(.2,1.4,.4,1);box-shadow:0 20px 50px rgba(0,0,0,.6)}
@keyframes pop{from{transform:translateY(-50%) scale(.85);opacity:0}}
.bhead{display:flex;gap:12px;align-items:center;padding-right:36px}
.bhead .art{width:72px;height:72px;flex:none;border-radius:14px;background:linear-gradient(#4b5a35,#3a4629);display:grid;place-items:center}
.bhead .art svg{width:60px;height:60px}
.desc{font-size:13px;color:var(--sub);margin:10px 0}
.eff{width:100%;border-collapse:collapse;font-size:13px}
.eff td{padding:7px 4px;border-bottom:1px solid #34402c}
.eff td:first-child{color:var(--sub)}
.eff td.arrow{color:var(--good);font-weight:800;text-align:right;white-space:nowrap}
.eff td.cur{text-align:right;white-space:nowrap}
.costrow{display:flex;gap:14px;justify-content:center;margin:12px 0 10px;font-size:15px}
.costrow .cost svg{width:20px;height:20px}
.reason{text-align:center;font-size:12px;color:var(--warn);margin-top:8px}
.blist{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.bitem{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid #34402c;border-radius:14px;padding:9px}
.bitem .art{width:56px;height:56px;flex:none;border-radius:12px;background:linear-gradient(#4b5a35,#3a4629);display:grid;place-items:center}
.bitem .art svg{width:46px;height:46px}
.bitem .nm{font-weight:800}
.bitem .small{line-height:1.35}
.bitem .btn{min-height:40px;padding:0 12px;font-size:14px;flex:none}
.bitem.locked{opacity:.55}

/* ===== 部隊 ===== */
.ulist{display:flex;flex-direction:column;gap:8px}
.urow{display:flex;gap:10px;align-items:center}
.uicon{width:46px;height:46px;flex:none;border-radius:12px;display:grid;place-items:center;background:#1a2a24;border:1px solid #2f5248}
.uicon svg{width:34px;height:34px}
.uicon.enemy{background:#2c1916;border-color:#5a2c24}
.uicon.off{filter:grayscale(1);opacity:.5}
.stats{display:flex;gap:10px;font-size:12px;color:var(--sub);flex-wrap:wrap}
.stats b{color:var(--text)}
.aff{font-size:11px;margin-top:2px}
.aff .s{color:var(--good)} .aff .w{color:var(--bad)}
.hero{display:flex;gap:12px}
.portrait{width:76px;height:76px;flex:none;border-radius:16px;overflow:hidden;border:2px solid #5a6a46;background:#111}
.portrait svg{width:100%;height:100%}
.portrait.sm{width:40px;height:40px;border-radius:10px;border-width:1px}
.portrait.xs{width:28px;height:28px;border-radius:8px;border-width:1px}
.portrait.locked svg{filter:brightness(0) opacity(.5)}
.hero .nm{font-size:17px;font-weight:800}
.hero .ttl{font-size:11px;color:var(--khaki)}
.skill{margin-top:6px;background:#1a2116;border-radius:10px;padding:6px 8px;font-size:12px}
.skill b{color:var(--gold)}
.mtx{width:100%;border-collapse:separate;border-spacing:3px;font-size:12px;text-align:center}
.mtx th{color:var(--sub);font-weight:700;font-size:11px}
.mtx td{background:#1a2116;border-radius:6px;padding:6px 0;font-weight:800}
.mtx td.s2{background:#24502a;color:#b8ffb0}.mtx td.s1{background:#2b4127;color:#a6e39c}.mtx td.n{color:var(--sub)}.mtx td.w1{background:#4a2a22;color:#ffb6a8}

/* ===== 出撃 ===== */
.stagebar{display:flex;align-items:center;gap:8px}
.stagebar .nav{width:46px;height:46px;flex:none;border-radius:12px;background:#273022;border:1px solid #3d4a33;display:grid;place-items:center;font-size:20px}
.stagebar .nav:disabled{opacity:.3}
.stagebar .mid{flex:1;text-align:center;min-width:0}
.stagebar .sn{font-size:22px;font-weight:900;letter-spacing:.04em}
.stagebar .sp{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side{margin-top:10px;border-radius:16px;padding:10px;border:1px solid}
.side.enemy{background:linear-gradient(#2d1c18,#241714);border-color:#5b2e26}
.side.ally{background:linear-gradient(#1b2a25,#16221d);border-color:#2f5248}
.side .hd{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;margin-bottom:8px}
.side .hd .grow{min-width:0}
.side .pw{font-size:12px;color:var(--sub);font-weight:700}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.slot{position:relative;border-radius:12px;padding:7px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:112px;text-align:center}
.side.enemy .slot{background:#3a221d;border:1px solid #64362c}
.side.ally .slot{background:#203530;border:1px solid #376357}
.side.ally button.slot:active{transform:scale(.96)}
.slot svg.ic{width:38px;height:38px}
.slot .t{font-size:12px;font-weight:800;line-height:1.2}
.slot .p{font-size:11px;color:var(--sub)}
.slot .wk{font-size:10px;color:#ffc7b8;line-height:1.25}
.slot .boss{position:absolute;top:-7px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:900;color:#2a1c00;background:var(--gold);border-radius:6px;padding:0 6px}
.slot.bossc{border-color:var(--gold)!important;box-shadow:0 0 0 1px var(--gold) inset}
.slot .hr{display:flex;align-items:center;gap:3px;font-size:10px;color:var(--khaki);max-width:100%}
.slot .hr span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .hr.none{color:var(--dim)}
.slot .mk{position:absolute;right:4px;top:3px;font-size:13px;font-weight:900}
.mk.g2{color:#8ff08a}.mk.g1{color:#c4e88a}.mk.n{color:#c9c9a8}.mk.b{color:#ff8b78}
.slot.locked{background:rgba(0,0,0,.25)!important;border-style:dashed!important;color:var(--dim);font-size:11px;justify-content:center}
.winbox{margin-top:12px;display:flex;gap:12px;align-items:center}
.wr{flex:none;width:96px;height:96px;border-radius:50%;display:grid;place-items:center;text-align:center;position:relative}
.wr .v{font-size:26px;font-weight:900;line-height:1}
.wr .l{font-size:11px;font-weight:800;margin-top:3px}
.wr .c{position:absolute;inset:0}
.rewards{font-size:13px;display:flex;flex-direction:column;gap:4px}
.rewards .row{gap:12px;flex-wrap:wrap}
.tips{margin-top:8px;font-size:12px;color:var(--sub)}

/* ===== 戦闘 ===== */
#battle{position:fixed;inset:0;z-index:40;background:#0d110b;display:flex;flex-direction:column}
#battle .bsafe{flex:none;height:var(--sat)}
#battle .bcanvas{flex:1;position:relative;min-height:0}
#battle canvas{position:absolute;inset:0;display:block}
#battle .bctl{flex:none;display:flex;gap:8px;align-items:center;padding:8px 12px calc(var(--sab) + 8px);background:#141a11;border-top:1px solid #2b3426}
.speed{display:flex;background:#0d110b;border:1px solid #344029;border-radius:12px;overflow:hidden}
.speed button{width:54px;min-height:44px;font-weight:900;color:var(--dim)}
.speed button.on{background:#3a4a2e;color:var(--gold)}
#btnSkip{margin-left:auto}

/* ===== 結果 ===== */
.result h2{margin:0;text-align:center;font-size:40px;font-weight:900;letter-spacing:.1em}
.result h2.win{color:var(--gold);text-shadow:0 0 18px rgba(241,196,83,.45)}
.result h2.lose{color:#c9b0a6}
.result .sub{text-align:center;color:var(--sub);font-size:13px;margin-bottom:12px}
.rlist{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.rline{display:flex;align-items:center;gap:8px;background:#1a2116;border-radius:10px;padding:8px 10px;font-size:14px}
.rline .grow{min-width:0}
.rline>svg{width:24px;height:24px;flex:none}
.rline .up{color:var(--good);font-weight:900}
.btns{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.btns .row>.btn{flex:1}
#toast{position:fixed;left:50%;bottom:calc(var(--sab) + 70px);transform:translateX(-50%);z-index:90;pointer-events:none;display:flex;flex-direction:column;gap:6px;align-items:center;width:calc(100% - 32px);max-width:420px}
#toast div{background:rgba(18,24,14,.95);border:1px solid #5a6a46;border-radius:12px;padding:9px 14px;font-size:13px;font-weight:700;animation:toast 2.6s forwards;text-align:center}
@keyframes toast{0%{opacity:0;transform:translateY(-8px)}10%,80%{opacity:1;transform:none}100%{opacity:0}}
textarea{width:100%;height:110px;background:#10150e;color:var(--text);border:1px solid #44523a;border-radius:10px;padding:8px;font:12px/1.4 ui-monospace,Menlo,monospace;-webkit-user-select:text;user-select:text}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="res" id="resM"><svg viewBox="0 0 24 24"><use href="#i-money"/></svg><b class="num" id="vM">0</b></div>
    <div class="res" id="resS"><svg viewBox="0 0 24 24"><use href="#i-steel"/></svg><b class="num" id="vS">0</b></div>
    <div class="stagepill" id="vStage">ST 1</div>
    <button class="iconbtn" data-act="menu" aria-label="メニュー"><svg viewBox="0 0 24 24"><path fill="#b0b9a0" d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg></button>
  </header>
  <main id="main">
    <section class="screen" id="scr-base"></section>
    <section class="screen hidden" id="scr-army"></section>
    <section class="screen hidden" id="scr-sortie"></section>
  </main>
  <nav id="tabs">
    <button data-act="tab" data-tab="base"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>基地<i class="dot" id="dotBase"></i></button>

<script id="logic">
var TF = (function () {
  'use strict';

  // ====== 乱数 ======
  function rngFrom(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hashInt(n) {
    n = (n ^ 61) ^ (n >>> 16);
    n = (n + (n << 3)) | 0;
    n = n ^ (n >>> 4);
    n = Math.imul(n, 0x27d4eb2d);
    n = n ^ (n >>> 15);
    return n >>> 0;
  }

  // ====== 兵種 ======
  var TYPES = ['inf', 'at', 'tank', 'art'];
  var UNIT = {
    inf:  { name: '歩兵',     short: '歩', hp: 110, atk: 13, cd: 1.0,  bld: 'barracks' },
    at:   { name: '対戦車兵', short: '対', hp: 95,  atk: 15, cd: 1.15, bld: 'atpost' },
    tank: { name: '戦車',     short: '戦', hp: 160, atk: 18, cd: 1.4,  bld: 'factory' },
    art:  { name: '砲兵',     short: '砲', hp: 85,  atk: 22, cd: 1.6,  bld: 'artpost' }
  };
  // AFF[攻撃側][防御側] = ダメージ倍率
  var AFF = {
    inf:  { inf: 1.0,  at: 1.5, tank: 0.6, art: 1.5 },
    tank: { inf: 1.5,  at: 0.6, tank: 1.0, art: 1.5 },
    at:   { inf: 0.75, at: 0.8, tank: 2.2, art: 0.75 },
    art:  { inf: 1.5,  at: 1.5, tank: 0.6, art: 1.0 }
  };

  var AFF2 = {};
  Object.keys(AFF).forEach(function (a) { AFF2[a] = {}; Object.keys(AFF[a]).forEach(function (d) { AFF2[a][d] = AFF[a][d] * AFF[a][d]; }); });

  // ====== 建物 ======
  // cm/cs: 建設費(資金/鋼材), g: 強化費の伸び
  var BLD = {
    hq:       { name: '司令部',     req: 1, cm: 300, cs: 170, g: 2.15 },
    supply:   { name: '補給所',     req: 1, cm: 100, cs: 40,  g: 1.95 },
    steel:    { name: '製鋼所',     req: 1, cm: 110, cs: 30,  g: 1.95 },
    depot:    { name: '倉庫',       req: 2, cm: 200, cs: 120, g: 2.0 },
    barracks: { name: '兵舎',       req: 1, cm: 60,  cs: 30,  g: 1.95, unit: 'inf' },
    atpost:   { name: '対戦車陣地', req: 2, cm: 80,  cs: 40,  g: 1.95, unit: 'at' },
    factory:  { name: '戦車工場',   req: 2, cm: 90,  cs: 60,  g: 1.95, unit: 'tank' },
    artpost:  { name: '砲兵陣地',   req: 3, cm: 90,  cs: 50,  g: 1.95, unit: 'art' },
    lab:      { name: '研究所',     req: 3, cm: 200, cs: 130, g: 2.05 }
  };
  var BLD_ORDER = ['supply', 'steel', 'depot', 'barracks', 'atpost', 'factory', 'artpost', 'lab'];
  var TYPE_BLD = { inf: 'barracks', at: 'atpost', tank: 'factory', art: 'artpost' };

  // ====== 指揮官 ======
  var HEROES = [
    { id: 'oni',   name: '鬼塚 剛',     title: '鬼軍曹',       fav: 'inf',  skill: 'charge',  unlock: 0 },
    { id: 'tetsu', name: '鉄崎 ミナ',   title: '鋼鉄の戦車長', fav: 'tank', skill: 'armor',   unlock: 3 },
    { id: 'taka',  name: '白鷹 レン',   title: '必中の狙撃手', fav: 'at',   skill: 'snipe',   unlock: 8 },
    { id: 'rai',   name: '雷門 ハヤト', title: '砲撃の雷神',   fav: 'art',  skill: 'barrage', unlock: 15 }
  ];
  var HERO = {};
  HEROES.forEach(function (h) { HERO[h.id] = h; });

  var SKILL = {
    charge:  { name: '突撃',     first: 3, cd: 11, dur: 6, mul: 1.5, desc: '味方全体の攻撃力を6秒間 +50%' },
    armor:   { name: '装甲',     first: 4, cd: 12, dur: 6, mul: 0.5, desc: '味方全体の被ダメージを6秒間 半減' },
    snipe:   { name: '一撃必中', first: 5, cd: 9,  mul: 4.0,         desc: '相性の良い敵1体に、攻撃力400%の必中ダメージ' },
    barrage: { name: '一斉射撃', first: 6, cd: 12, mul: 1.2,         desc: '敵全体に、攻撃力120%の砲撃ダメージ' }
  };

  // ====== バランス調整値 ======
  var K = {
    unitPerLv: 0.12, labPerLv: 0.08, heroBase: 1.05, heroPerLv: 0.03, favMul: 1.25,
    miss: 0.06, crit: 0.10, critMul: 1.5,
    maxT: 60,
    startMoney: 500, startSteel: 300,
    lossExp: 0.5, firstMul: 2, bossMul: 2, bossHp: 2.6, bossAtk: 1.4, bossTotal: 1.08, normMin: 0.6, normMax: 2.4,
    typeAdj: { inf: 1.04, at: 0.95, tank: 0.97, art: 1.18 },
    baseCapH: 2, depotCapH: 1, depotMaxLv: 22,
    // 敵の総合戦力倍率 T(s) = b + a*s^p + c*s^2
    enA: 0.33, enP: 1.3, enC: 0.0095, enB: 1.2,
    // 報酬
    rwM: 20, rwS: 12, rwP: 1.5, rwExpA: 4, rwExpP: 1.2,
    // 生産(1時間あたり)
    prodM: 600, prodS: 400, prodP: 1.5
  };

  // ====== 基本関数 ======
  function lv(st, id) { var b = st.bld[id]; return b ? b.lv : 0; }
  function slotsFor(hqLv) { return Math.min(6, 2 + Math.floor(hqLv / 2)); }
  function slots(st) { return slotsFor(lv(st, 'hq')); }
  function maxLevel(st, id) {
    if (id === 'hq') return 999;
    var cap = lv(st, 'hq') * 2;
    if (id === 'depot') return Math.min(cap, K.depotMaxLv);
    return cap;
  }
  function upgradeCost(id, curLv) {
    var d = BLD[id];
    var f = Math.pow(curLv + 1, d.g);
    return { m: Math.round(d.cm * f / 10) * 10, s: Math.round(d.cs * f / 10) * 10 };
  }
  function prodRate(id, l) {
    if (l <= 0) return 0;
    var base = id === 'supply' ? K.prodM : K.prodS;
    return base * Math.pow(l, K.prodP);
  }
  function capHours(st) { return K.baseCapH + K.depotCapH * lv(st, 'depot'); }
  function freeSlots(st) {
    var used = {};
    Object.keys(st.bld).forEach(function (k) { used[st.bld[k].slot] = true; });
    var r = [];
    for (var i = 0; i < 9; i++) if (!used[i]) r.push(i);
    return r;
  }

  function canUpgrade(st, id) {
    var cur = lv(st, id);
    var d = BLD[id];
    if (cur === 0) {
      if (lv(st, 'hq') < d.req) return { ok: false, reason: '司令部Lv' + d.req + 'で解放' };
      if (!freeSlots(st).length) return { ok: false, reason: '空き区画がありません' };
    } else if (cur >= maxLevel(st, id)) {
      return { ok: false, reason: id === 'depot' && cur >= K.depotMaxLv ? '最大レベル' : '司令部の強化が必要', cap: true };
    }
    var c = upgradeCost(id, cur);
    if (st.money < c.m || st.steel < c.s) return { ok: false, reason: '資源が不足', cost: c, short: true };
    return { ok: true, cost: c };
  }

  function settle(st, now) {
    var capH = capHours(st);
    ['supply', 'steel'].forEach(function (id) {
      var b = st.bld[id];
      if (!b) return;
      var rate = prodRate(id, b.lv);
      var cap = rate * capH;
      var dt = (now - b.t) / 3600000;
      if (!(dt > 0)) dt = 0;
      b.stored = Math.min(cap, (b.stored || 0) + rate * dt);
      if (b.stored < 0 || !isFinite(b.stored)) b.stored = 0;
      b.t = now;
    });
  }
  function storedInfo(st, now) {
    settle(st, now);
    var capH = capHours(st);
    var r = {};
    ['supply', 'steel'].forEach(function (id) {
      var b = st.bld[id];
      if (!b) { r[id] = null; return; }
      var rate = prodRate(id, b.lv);
      r[id] = { stored: Math.floor(b.stored), cap: Math.floor(rate * capH), rate: rate, full: b.stored >= rate * capH - 0.5 };
    });
    return r;
  }
  function collect(st, now) {
    settle(st, now);
    var gm = 0, gs = 0;
    if (st.bld.supply) { gm = Math.floor(st.bld.supply.stored); st.bld.supply.stored -= gm; }
    if (st.bld.steel) { gs = Math.floor(st.bld.steel.stored); st.bld.steel.stored -= gs; }
    st.money += gm; st.steel += gs;
    return { m: gm, s: gs };
  }

  function doUpgrade(st, id, now, slot) {
    var chk = canUpgrade(st, id);
    if (!chk.ok) return chk;
    settle(st, now);
    st.money -= chk.cost.m; st.steel -= chk.cost.s;
    if (!st.bld[id]) {
      var fs = freeSlots(st);
      if (slot === undefined || fs.indexOf(slot) < 0) slot = fs[0];
      st.bld[id] = { lv: 1, slot: slot };
      if (id === 'supply' || id === 'steel') { st.bld[id].stored = 0; st.bld[id].t = now; }
    } else {
      st.bld[id].lv++;
    }
    return { ok: true, cost: chk.cost };
  }

  // ====== 部隊の強さ ======
  function typeUnlocked(st, t) { return lv(st, TYPE_BLD[t]) > 0; }
  function unlockedTypes(st) { return TYPES.filter(function (t) { return typeUnlocked(st, t); }); }
  function unitMult(st, t) { var l = lv(st, TYPE_BLD[t]); return l > 0 ? 1 + K.unitPerLv * (l - 1) : 0; }
  function labMult(st) { return 1 + K.labPerLv * lv(st, 'lab'); }
  function heroMult(hlv, fav) { return (K.heroBase + K.heroPerLv * (hlv - 1)) * (fav ? K.favMul : 1); }
  function squadMult(st, t, heroId) {
    var m = unitMult(st, t) * labMult(st);
    if (heroId && st.heroes[heroId]) m *= heroMult(st.heroes[heroId].lv, HERO[heroId].fav === t);
    return m;
  }
  function powerOf(hp, atk, cd) { return Math.round(Math.sqrt(hp * atk / cd) * 2.645); }
  function makeSquad(t, mult, opt) {
    opt = opt || {};
    var u = UNIT[t];
    var hp = Math.max(1, Math.round(u.hp * mult * (opt.hpMul || 1)));
    var atk = u.atk * mult * (opt.atkMul || 1);
    return { type: t, maxHp: hp, atk: atk, cd: u.cd, hero: opt.hero || null, boss: !!opt.boss, power: powerOf(hp, atk, u.cd) };
  }
  function squadStats(st, t, heroId) { return makeSquad(t, squadMult(st, t, heroId), { hero: heroId }); }
  function expNeed(l) { return Math.round(20 + 14 * Math.pow(l, 1.55)); }
  function addHeroExp(st, id, exp) {
    var h = st.heroes[id];
    if (!h) return null;
    var before = h.lv;
    h.exp += exp;
    while (h.exp >= expNeed(h.lv)) { h.exp -= expNeed(h.lv); h.lv++; }
    return { id: id, gain: exp, before: before, after: h.lv };
  }

  // ====== ステージ ======
  var PLACES = ['荒野', '北部平原', '赤土の渓谷', '旧市街', '港湾地区', '黒い森', '砂漠地帯', '雪原', '高原', '河川敷', '丘陵地', '鉱山跡', '国境線', '湿地帯', '工業地帯', '霧の峠', '廃線跡', '飛行場跡', '海岸線', '火山帯'];
  var THEMES = {
    inf:  '歩兵大隊', at: '対戦車防衛線', tank: '機甲師団', art: '砲兵連隊', mix: '混成部隊'
  };
  var BOSS_NAMES = { inf: '精鋭突撃隊', at: '重対戦車隊', tank: '重戦車', art: '列車砲' };
  function enemyCount(s) { return s <= 3 ? 2 : s <= 8 ? 3 : s <= 18 ? 4 : s <= 30 ? 5 : 6; }
  function enemyTotal(s) {
    var ease = s < 12 ? 0.75 + 0.25 * (s - 1) / 11 : 1; // 序盤はやさしく
    return (K.enB + K.enA * Math.pow(s, K.enP) + K.enC * s * s) * ease;
  }
  function stagePool(s) {
    if (s <= 1) return ['inf'];
    if (s <= 3) return ['inf', 'at'];
    if (s <= 8) return ['inf', 'at', 'art'];
    return TYPES;
  }
  function refTypesFor(s) { return s <= 10 ? ['inf'] : s <= 16 ? ['inf', 'at', 'tank'] : TYPES; }
  // 全兵種が倍率xの「基準軍」(指揮官なし)が勝率50%になるxを求める
  function refBreakEven(eSquads, refTypes) {
    var n = eSquads.length;
    function evalAt(arr, x, k) {
      var p = arr.map(function (t) { return makeSquad(t, x); });
      var w = 0, sc = 0;
      for (var i = 0; i < k; i++) {
        var r = simulate(p, eSquads, 5000 + i * 7919, false);
        if (r.win) w++;
        sc += scoreOf(r);
      }
      return { wr: w / k, sc: sc / k };
    }
    var cur = [];
    for (var i = 0; i < n; i++) cur.push(refTypes[0]);
    if (refTypes.length > 1) {
      var best = evalAt(cur, 1, 8).sc;
      for (var pass = 0; pass < 2; pass++) {
        var improved = false;
        for (i = 0; i < n; i++) {
          for (var k = 0; k < refTypes.length; k++) {
            if (cur[i] === refTypes[k]) continue;
            var cand = cur.slice(); cand[i] = refTypes[k];
            var sc = evalAt(cand, 1, 8).sc;
            if (sc > best + 1e-6) { best = sc; cur = cand; improved = true; }
          }
        }
        if (!improved) break;
      }
    }
    var lo = Math.log(0.2), hi = Math.log(5);
    for (var it = 0; it < 10; it++) {
      var mid = (lo + hi) / 2;
      if (evalAt(cur, Math.exp(mid), 16).wr >= 0.5) hi = mid; else lo = mid;
    }
    return Math.exp((lo + hi) / 2);
  }
  var stageCache = {};
  function stageInfo(s) {
    if (stageCache[s]) return stageCache[s];
    var rnd = rngFrom(hashInt(s * 7919 + 17));
    var n = enemyCount(s);
    var pool = stagePool(s);
    var theme = 'mix', main = null;
    if (s >= 4 && rnd() < 0.6) { main = pool[Math.floor(rnd() * pool.length)]; theme = main; }
    var boss = s % 10 === 0;
    var types = [];
    for (var i = 0; i < n; i++) {
      var t = (main && rnd() < 0.6) ? main : pool[Math.floor(rnd() * pool.length)];
      types.push(t);
    }
    if (main && types.indexOf(main) < 0) types[0] = main;
    var vars = types.map(function () { return 0.92 + rnd() * 0.16; });
    var bossIdx = boss ? Math.floor(rnd() * n) : -1;
    if (boss && main) types[bossIdx] = main;
    // 単位倍率の敵を作り、「全兵種が同じ強さの自軍」が五分になる倍率で編成の難しさを均す
    var unitE = types.map(function (t, i) {
      return makeSquad(t, vars[i], i === bossIdx ? { boss: true, hpMul: K.bossHp, atkMul: K.bossAtk } : {});
    });
    var sumV = 0;
    unitE.forEach(function (e) { sumV += e.power / (100 * UNIT_POW[e.type]); });
    var be = refBreakEven(unitE, refTypesFor(s));
    // 指揮官スキル込みの実戦では兵種ごとに少し難易度がずれるので、自動テストの結果から補正する
    var tf = 0;
    types.forEach(function (t) { tf += K.typeAdj[t] / n; });
    var norm = Math.min(K.normMax, Math.max(K.normMin, tf / be));
    var w = Math.min(1, Math.max(0, (s - 4) / 16)); // 序盤は補正を弱める(兵種がそろうまで)
    norm = 1 + (norm - 1) * w;
    var m = enemyTotal(s) * (boss ? K.bossTotal : 1) * norm / sumV;
    var enemies = types.map(function (t, i) {
      return makeSquad(t, vars[i] * m, i === bossIdx ? { boss: true, hpMul: K.bossHp, atkMul: K.bossAtk } : {});
    });
    var rm = Math.pow(s, K.rwP);
    var reward = {
      m: Math.round((40 + K.rwM * rm) * (boss ? K.bossMul : 1) / 5) * 5,
      s: Math.round((25 + K.rwS * rm) * (boss ? K.bossMul : 1) / 5) * 5,
      exp: Math.round((10 + K.rwExpA * Math.pow(s, K.rwExpP)) * (boss ? 1.5 : 1))
    };
    var place = PLACES[hashInt(s * 31 + 7) % PLACES.length];
    var info = {
      s: s, place: place, theme: boss ? 'ボス戦' : THEMES[theme], main: main, boss: boss,
      bossName: boss ? BOSS_NAMES[types[bossIdx]] : null, norm: norm, be: be,
      enemies: enemies, reward: reward,
      power: enemies.reduce(function (a, e) { return a + e.power; }, 0)
    };
    stageCache[s] = info;
    return info;
  }

  // ====== 編成 ======
  function normalizeForm(st, form) {
    var n = slots(st);
    var types = unlockedTypes(st);
    var out = [];
    var used = {};
    for (var i = 0; i < n; i++) {
      var f = form && form[i] ? form[i] : null;
      var t = f && types.indexOf(f.type) >= 0 ? f.type : types[0];
      var h = f && f.hero && st.heroes[f.hero] && !used[f.hero] ? f.hero : null;
      if (h) used[h] = true;
      out.push({ type: t, hero: h });
    }
    return out;
  }
  function formSquads(st, form) {
    return form.map(function (f) { return squadStats(st, f.type, f.hero); });
  }
  function assignHeroes(st, typesArr) {
    var heroes = Object.keys(st.heroes).sort(function (a, b) { return st.heroes[b].lv - st.heroes[a].lv; });
    var form = typesArr.map(function (t) { return { type: t, hero: null }; });
    var rest = [];
    heroes.forEach(function (h) {
      var fav = HERO[h].fav;
      for (var i = 0; i < form.length; i++) {
        if (!form[i].hero && form[i].type === fav) { form[i].hero = h; return; }
      }
      rest.push(h);
    });
    rest.forEach(function (h) {
      var best = -1, bm = -1;
      for (var i = 0; i < form.length; i++) {
        if (form[i].hero) continue;
        var m = unitMult(st, form[i].type) * UNIT_POW[form[i].type];
        if (m > bm) { bm = m; best = i; }
      }
      if (best >= 0) form[best].hero = h;
    });
    return form;
  }
  var UNIT_POW = {};

  // ====== 保存と読み込み ======
  function sanitize(o) {
    var d = TF.newState(now());
    if (!o || typeof o !== 'object' || o.v !== 1) return null;
    var s = {};
    Object.keys(d).forEach(function (k) { s[k] = o[k] !== undefined ? o[k] : d[k]; });
    s.money = +s.money || 0; s.steel = +s.steel || 0;
    if (!s.bld || !s.bld.hq) s.bld = d.bld;
    Object.keys(s.bld).forEach(function (k) {
      if (!TF.BLD[k]) { delete s.bld[k]; return; }
      var b = s.bld[k]; b.lv = Math.max(1, b.lv | 0); b.slot = b.slot | 0;
      if (k === 'supply' || k === 'steel') { b.stored = +b.stored || 0; b.t = +b.t || now(); }
    });
    s.bld.hq.slot = 4;
    if (!s.heroes || !s.heroes.oni) s.heroes = d.heroes;
    Object.keys(s.heroes).forEach(function (k) { if (!TF.HERO[k]) delete s.heroes[k]; });
    s.cleared = Math.max(0, s.cleared | 0);
    s.sel = Math.min(Math.max(1, s.sel | 0), s.cleared + 1);
    s.form = TF.normalizeForm(s, s.form);
    s.stats = s.stats || { battles: 0, wins: 0 };
    if ([1, 2, 4].indexOf(s.speed) < 0) s.speed = 1;
    if (['base', 'army', 'sortie'].indexOf(s.tab) < 0) s.tab = 'base';
    s.flags = o.flags || {};
    s.lastSeen = +o.lastSeen || now();
    return s;
  }
  var saveFailed = false;
  function save() {
    if (!st) return;
    st.lastSeen = now();
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(st)); saveFailed = false; }
    catch (e) { if (!saveFailed) { saveFailed = true; toast('保存できませんでした(プライベートブラウズ等)'); } }
  }
  function load() {
    try {
      var raw = localStorage.getItem(SAVE_KEY);
      if (raw) return sanitize(JSON.parse(raw));
    } catch (e) { }
    return null;
  }

  // ====== 画面: 上部 ======
  function renderTop() {
    $('vM').textContent = fmt(st.money);

    $('vStage').textContent = 'ST ' + (st.cleared + 1);
    var anyUp = TF.BLD_ORDER.concat(['hq']).some(function (id) { return TF.lv(st, id) > 0 && TF.canUpgrade(st, id).ok; });
    var info = TF.storedInfo(st, now());
    var full = (info.supply && info.supply.full) || (info.steel && info.steel.full);
    $('dotBase').classList.toggle('on', !!(anyUp || full) && curTab !== 'base');
  }

  // ====== 次の目標 ======
  function nextGoal() {
    var L = function (id) { return TF.lv(st, id); };
    if (!L('supply')) return '空き区画をタップして「補給所」を建てよう。資金を自動で生産します。';
    if (st.cleared === 0) return '下の「出撃」からステージ1に挑戦しよう!';
    if (!L('steel')) return '「製鋼所」を建てよう。鋼材を自動で生産します。';
    if (L('barracks') < 3) return '「兵舎」を強化して歩兵を強くしよう。';
    if (L('hq') < 2) return '「司令部」をLv2にすると、部隊の枠が増えて新しい施設が建てられます。';
    if (!L('atpost')) return '「対戦車陣地」を建てよう。対戦車兵は戦車にとても強い!';
    if (!L('factory')) return '「戦車工場」を建てよう。戦車は歩兵と砲兵に強い主力です。';
    if (!L('depot')) return '「倉庫」を建てると、放置で資源が貯まる時間が延びます。';
    if (L('hq') < 3) return '「司令部」をLv3にすると、砲兵陣地と研究所が建てられます。';
    if (!L('artpost')) return '「砲兵陣地」を建てよう。砲兵は歩兵と対戦車兵に強い。';
    if (!L('lab')) return '「研究所」を建てよう。全兵種をまとめて強化できます。';
    if (TF.slots(st) < 6) return '司令部を強化して部隊の枠を増やそう(現在 ' + TF.slots(st) + '/6)。';
    return '敵の編成を見て相性の良い兵種で挑もう。勝てないときは前のステージで稼いで強化!';
  }

  // ====== 画面: 基地 ======
  function renderBase() {
    var t = now();
    var info = TF.storedInfo(st, t);
    var gm = info.supply ? info.supply.stored : 0, gs = info.steel ? info.steel.stored : 0;
    var html = '<div class="hint"><span class="tag">指令</span><span>' + esc(nextGoal()) + '</span></div>';
    html += '<div class="collect card"><div class="info">貯まっている資源<br><b class="num">' + icoMoneyInline() + '<span id="cM">' + fmt(gm) + '</span></b>  <b class="num">' + icoSteelInline() + '<span id="cS">' + fmt(gs) + '</span></b>' +
      '<br>放置上限 ' + TF.capHours(st) + '時間</div><button class="btn green" id="btnCollect" data-act="collect"' + (gm + gs > 0 ? '' : ' disabled') + '>回収</button></div>';
    html += '<div class="grid" id="grid">';
    var bySlot = {};
    Object.keys(st.bld).forEach(function (k) { bySlot[st.bld[k].slot] = k; });
    for (var i = 0; i < 9; i++) {
      var id = bySlot[i];
      if (!id) {
        html += '<button class="tile empty" data-act="tile" data-slot="' + i + '"><div class="plus">+</div><div class="lbl">建設</div></button>';
        continue;
      }
      var b = st.bld[id];
      var up = TF.canUpgrade(st, id).ok;
      var extra = '';
      if (id === 'supply' || id === 'steel') {
        var si = info[id];
        var pct = si.cap > 0 ? Math.min(100, si.stored / si.cap * 100) : 0;
        extra = '<div class="store' + (id === 'steel' ? ' steel' : '') + '"><i id="bar-' + id + '" style="width:' + pct.toFixed(1) + '%"></i></div>';
        extra += '<div class="bub' + (si.full ? ' full' : '') + (si.stored >= 1 ? '' : ' hidden') + '" id="bub-' + id + '">' + (id === 'supply' ? icoMoney() : icoSteel()) + '<span>' + fmt(si.stored) + '</span></div>';
        up = false;
      }
      html += '<button class="tile' + (id === 'hq' ? ' hq' : '') + '" data-act="tile" data-slot="' + i + '">' + bSvg(id) +
        '<div class="nm">' + TF.BLD[id].name + '</div><div class="lv">Lv' + b.lv + '</div>' + (up ? '<div class="up">↑</div>' : '') + extra + '</button>';
    }
    html += '</div>';
    var power = TF.formSquads(st, st.form).reduce(function (a, q) { return a + q.power; }, 0);
    html += '<div class="basestats">' +
      '<div class="card"><div class="k">部隊の枠</div><div class="v">' + TF.slots(st) + ' / 6</div></div>' +
      '<div class="card"><div class="k">施設の上限レベル</div><div class="v">Lv' + TF.lv(st, 'hq') * 2 + '</div></div>' +
      '<div class="card"><div class="k">編成中の総戦力</div><div class="v num">' + fmt(power) + '</div></div>' +
      '<div class="card"><div class="k">最高到達</div><div class="v">ステージ' + st.cleared + '</div></div></div>';
    $('scr-base').innerHTML = html;
  }
  function icoMoneyInline() { return '<svg viewBox="0 0 24 24" style="display:inline-block;width:15px;height:15px;vertical-align:-2px;margin-right:2px"><use href="#i-money"/></svg>'; }
  function icoSteelInline() { return '<svg viewBox="0 0 24 24" style="display:inline-block;width:15px;height:15px;vertical-align:-2px;margin-right:2px"><use href="#i-steel"/></svg>'; }

  // 生産の表示だけを1秒ごとに更新
  // (要素を作り直すとタップを取りこぼすので、数値と棒だけ書き換える)
  function liveBase() {
    if (curTab !== 'base' || !$('cM')) return;
    var info = TF.storedInfo(st, now());
    var gm = info.supply ? info.supply.stored : 0, gs = info.steel ? info.steel.stored : 0;
    $('cM').textContent = fmt(gm); $('cS').textContent = fmt(gs);
    $('btnCollect').disabled = gm + gs <= 0;
    ['supply', 'steel'].forEach(function (id) {
      var si = info[id], bar = $('bar-' + id), bub = $('bub-' + id);
      if (!si || !bar) return;
      bar.style.width = (si.cap > 0 ? Math.min(100, si.stored / si.cap * 100) : 0).toFixed(1) + '%';
      bub.classList.toggle('hidden', si.stored < 1);
      bub.classList.toggle('full', si.full);
      bub.lastChild.textContent = fmt(si.stored);
    });
  }

  // ====== 施設シート ======
  function effectRows(id, l) {
    var rows = [], cur = l, nx = l + 1;
    function pct(m) { return '×' + m.toFixed(2); }
    if (id === 'hq') {
      rows.push(['部隊の枠', TF.slotsFor(cur), TF.slotsFor(nx) + (TF.slotsFor(nx) >= 6 ? '(最大)' : '')]);
      rows.push(['施設の上限', 'Lv' + cur * 2, 'Lv' + nx * 2]);
    } else if (id === 'supply' || id === 'steel') {
      var nm = id === 'supply' ? '資金' : '鋼材';
      var capH = TF.capHours(st);
      rows.push([nm + 'の生産(1時間)', cur ? fmt(TF.prodRate(id, cur)) : '-', fmt(TF.prodRate(id, nx))]);
      rows.push(['貯蔵の上限(' + capH + '時間分)', cur ? fmt(TF.prodRate(id, cur) * capH) : '-', fmt(TF.prodRate(id, nx) * capH)]);
    } else if (id === 'depot') {
      rows.push(['放置の上限時間', (TF.K.baseCapH + TF.K.depotCapH * cur) + '時間', (TF.K.baseCapH + TF.K.depotCapH * nx) + '時間']);
    } else if (id === 'lab') {
      rows.push(['全兵種の能力', pct(1 + TF.K.labPerLv * cur), pct(1 + TF.K.labPerLv * nx)]);
    } else {
      var t = TF.BLD[id].unit;
      rows.push([TF.UNIT[t].name + 'の能力', cur ? pct(1 + TF.K.unitPerLv * (cur - 1)) : '未解放', pct(1 + TF.K.unitPerLv * (nx - 1))]);
    }
    return rows;
  }
  function unitCardHtml(t) {

      (on ? '<div class="stats"><span>HP <b class="num">' + fmt(q.maxHp) + '</b></span><span>攻撃 <b class="num">' + fmt(q.atk) + '</b></span><span>戦力 <b class="num">' + fmt(q.power) + '</b></span></div>' : '') +

  function openBuilding(id) {
    var l = TF.lv(st, id), d = TF.BLD[id];

    var html = '<div class="grab"></div><button class="close" data-act="sheet-close" aria-label="閉じる">✕</button>';
    html += '<div class="bhead"><div class="art">' + bSvg(id) + '</div><div><h3>' + d.name + '</h3><div class="row" style="margin-top:4px"><span class="pill gold">Lv' + l + '</span><span class="small">上限 Lv' + (id === 'hq' ? '∞' : max) + '</span></div></div></div>';
    html += '<div class="desc">' + BDESC[id] + '</div>';
    if (id === 'supply' || id === 'steel') {
      var si = TF.storedInfo(st, now())[id];
      html += '<div class="card" style="margin-bottom:8px"><div class="row"><span class="grow small">貯まっている' + (id === 'supply' ? '資金' : '鋼材') + '</span><b class="num">' + fmt(si.stored) + ' / ' + fmt(si.cap) + '</b></div><div class="bar" style="margin-top:6px"><i style="width:' + Math.min(100, si.stored / Math.max(1, si.cap) * 100) + '%;' + (id === 'steel' ? 'background:var(--steel)' : 'background:var(--gold)') + '"></i></div>' +
        '<div class="small" style="margin-top:4px">' + (si.full ? '満杯です。回収しましょう!' : 'あと ' + fmtDur((si.cap - si.stored) / si.rate * 3600000) + 'で満杯') + '</div></div>';
    }
    var maxed = id === 'depot' && l >= TF.K.depotMaxLv;
    if (!maxed) {
      html += '<table class="eff">' + effectRows(id, l).map(function (r) { return '<tr><td>' + r[0] + '</td><td class="cur">' + r[1] + '</td><td class="arrow">→ ' + r[2] + '</td></tr>'; }).join('') + '</table>';
    } else {
      html += '<div class="card small">最大レベルです(放置上限 ' + TF.capHours(st) + '時間)。</div>';
    }
    if (id === 'hq') {
      var unl = TF.BLD_ORDER.filter(function (k) { return TF.BLD[k].req === l + 1; });
      if (unl.length) html += '<div class="small" style="margin-top:8px">Lv' + (l + 1) + 'で建設可能: <b style="color:var(--gold)">' + unl.map(function (k) { return TF.BLD[k].name; }).join('・') + '</b></div>';
    }
    if (d.unit) html += unitCardHtml(d.unit);
    if (!maxed) {
      var c = TF.upgradeCost(id, l);
      html += '<div class="costrow">' + costHtml(c) + '</div>';
      html += '<button class="btn wide big" data-act="upgrade" data-id="' + id + '"' + (chk.ok ? '' : ' disabled') + '>強化する Lv' + l + ' → ' + (l + 1) + '</button>';
      if (!chk.ok) html += '<div class="reason">' + esc(chk.reason) + (chk.short ? '(出撃で稼ぐか、生産施設から回収しよう)' : '') + '</div>';
    }
    openSheet(html);
  }
  function openBuildMenu(slot) {
    var html = '<div class="grab"></div><button class="close" data-act="sheet-close" aria-label="閉じる">✕</button><h3>施設を建設</h3><div class="small">区画' + (slot + 1) + 'に建てる施設を選んでください。</div><div class="blist">';
    var avail = TF.BLD_ORDER.filter(function (id) { return !st.bld[id]; });
    if (!avail.length) html += '<div class="card small">すべての施設を建設済みです。</div>';
    avail.forEach(function (id) {
      var d = TF.BLD[id], chk = TF.canUpgrade(st, id), c = TF.upgradeCost(id, 0);
      var locked = TF.lv(st, 'hq') < d.req;
      html += '<div class="bitem' + (locked ? ' locked' : '') + '"><div class="art">' + bSvg(id) + '</div><div class="grow"><div class="nm">' + d.name + '</div><div class="small">' + BDESC[id] + '</div>' +
        '<div class="row" style="margin-top:3px;font-size:13px;gap:10px">' + (locked ? '<span class="pill red">司令部Lv' + d.req + 'で解放</span>' : costHtml(c)) + '</div></div>' +
        '<button class="btn" data-act="build" data-id="' + id + '" data-slot="' + slot + '"' + (chk.ok ? '' : ' disabled') + '>建設</button></div>';
    });

  }
  function openSheet(html, keepScroll) {
    var y = $('sheet').scrollTop;
    $('sheet').innerHTML = html;
    $('sheetWrap').classList.remove('hidden');
    $('sheet').scrollTop = keepScroll ? y : 0;
  }
  function closeSheet() { $('sheetWrap').classList.add('hidden'); $('sheet').innerHTML = ''; sheetCtx = null; }
  var sheetCtx = null;

  function openModal(html) { $('modal').innerHTML = html; $('modalWrap').classList.remove('hidden'); $('modal').scrollTop = 0; }
  function closeModal() { $('modalWrap').classList.add('hidden'); $('modal').innerHTML = ''; }

  // ====== 画面: 部隊 ======
  function renderArmy() {
    var html = '<h2 class="sec" style="margin-top:4px">兵種</h2><div class="ulist">';
    TF.TYPES.forEach(function (t) {
      var on = TF.typeUnlocked(st, t), q = TF.squadStats(st, t, null), b = TF.TYPE_BLD[t];

        (on ? '<div class="stats"><span>HP <b class="num">' + fmt(q.maxHp) + '</b></span><span>攻撃 <b class="num">' + fmt(q.atk) + '</b></span><span>戦力 <b class="num">' + fmt(q.power) + '</b></span></div>' : '') +
        '<div class="aff"><span class="s">強い: ' + names(STRONG[t]) + '</span> / <span class="w">弱い: ' + names(WEAK[t]) + '</span></div></div></div>';

          '<div class="small" style="margin-top:4px">ステージ' + hd.unlock + 'をクリアすると着任</div><div class="skill">固有スキル <b>' + sk.name + '</b>: ' + sk.desc + '</div></div></div>';

      var need = TF.expNeed(h.lv);

        '<div class="ttl">' + hd.title + ' ・ 得意: ' + TF.UNIT[hd.fav].name + '</div>' +
        '<div class="row" style="margin-top:4px"><div class="bar grow"><i style="width:' + (h.exp / need * 100).toFixed(1) + '%;background:linear-gradient(90deg,#c99a2e,#f1c453)"></i></div><span class="small num">' + fmt(h.exp) + '/' + fmt(need) + '</span></div>' +
        '<div class="stats" style="margin-top:2px"><span>率いる部隊 <b>×' + TF.heroMult(h.lv, false).toFixed(2) + '</b></span><span>得意兵種なら <b>×' + TF.heroMult(h.lv, true).toFixed(2) + '</b></span></div>' +
        '<div class="skill">固有スキル <b>' + sk.name + '</b>: ' + sk.desc + '</div>' +
        '<div class="small" style="margin-top:4px">' + (assigned[hd.id] ? '部隊' + assigned[hd.id] + 'を指揮中' : '待機中(出撃画面で配属)') + '</div></div></div>';

    html += '</div>';
    html += '<h2 class="sec">相性表</h2><div class="card"><table class="mtx"><tr><th>攻撃→</th>' + TF.TYPES.map(function (t) { return '<th>' + SHORT[t] + '</th>'; }).join('') + '</tr>';
    TF.TYPES.forEach(function (a) {
      html += '<tr><th>' + SHORT[a] + '</th>' + TF.TYPES.map(function (d) {
        var v = TF.AFF[a][d];
        var c = v >= 2 ? 's2' : v >= 1.4 ? 's1' : v >= 1 ? 'n' : 'w1';
        var m = v >= 2 ? '◎' : v >= 1.4 ? '○' : v >= 1 ? '−' : '△';
        return '<td class="' + c + '">' + m + '<br><span style="font-size:10px;font-weight:600">×' + v + '</span></td>';
      }).join('') + '</tr>';

  // ====== 画面: 出撃 ======
  function matchupMark(t, enemies) {
    var dealt = 0, taken = 0;
    enemies.forEach(function (e) { dealt += TF.AFF[t][e.type]; taken += TF.AFF[e.type][t]; });
    var r = dealt / taken;
    if (r >= 1.6) return ['g2', '◎'];
    if (r >= 1.15) return ['g1', '○'];
    if (r >= 0.85) return ['n', '−'];
    return ['b', '×'];
  }
  function wrInfo(w) {
    if (w >= 0.85) return ['楽勝', '#7fd17a'];
    if (w >= 0.6) return ['優勢', '#a9d36a'];
    if (w >= 0.4) return ['互角', '#f0c34a'];
    if (w >= 0.15) return ['苦戦', '#f08c4a'];
    return ['危険', '#ef6b5b'];
  }
  function getWinRate() {
    var key = st.sel + '|' + JSON.stringify(st.form) + '|' + JSON.stringify(st.bld, function (k, v) { return k === 'stored' || k === 't' ? undefined : v; }) + '|' + JSON.stringify(st.heroes);
    if (wrCache && wrCache.key === key) return wrCache.v;
    var v = TF.predict(st, st.form, st.sel, 100);
    wrCache = { key: key, v: v };
    return v;
  }
  function renderSortie() {
    st.form = TF.normalizeForm(st, st.form);
    var s = st.sel, info = TF.stageInfo(s);
    var cleared = s <= st.cleared;
    var html = '<div class="stagebar"><button class="nav" data-act="stage" data-d="-1"' + (s <= 1 ? ' disabled' : '') + ' aria-label="前のステージ">◀</button>' +
      '<div class="mid"><div class="sn">ステージ ' + s + '</div><div class="sp">' + esc(info.place) + ' ・ ' + esc(info.theme) + (cleared ? ' ・ <span style="color:var(--good)">クリア済</span>' : ' ・ <span style="color:var(--gold)">未踏</span>') + '</div></div>' +
      '<button class="nav" data-act="stage" data-d="1"' + (s >= st.cleared + 1 ? ' disabled' : '') + ' aria-label="次のステージ">▶</button></div>';
    if (s < st.cleared + 1) html += '<div style="text-align:center;margin-top:6px"><button class="pill" data-act="stage-latest" style="font-size:12px;padding:5px 12px">最新のステージ ' + (st.cleared + 1) + ' へ ▶▶</button></div>';
    // 敵
    html += '<div class="side enemy"><div class="hd"><span class="grow">敵部隊' + (info.boss ? ' <span class="pill gold">ボス: ' + esc(info.bossName) + '</span>' : '') + '</span><span class="pw">戦力 ' + fmt(info.power) + '</span></div><div class="slots">';
    info.enemies.forEach(function (e) {
      html += '<div class="slot' + (e.boss ? ' bossc' : '') + '">' + (e.boss ? '<span class="boss">BOSS</span>' : '') + unitSvg(e.type, ENEMY_C, 'ic') + '<div class="t">' + TF.UNIT[e.type].name + '</div><div class="p num">戦力 ' + fmt(e.power) + '</div><div class="wk">弱点: ' + names(counters(e.type)) + '</div></div>';
    });
    html += '</div></div>';
    // 自軍
    var squads = TF.formSquads(st, st.form);
    var myPower = squads.reduce(function (a, q) { return a + q.power; }, 0);
    html += '<div class="side ally"><div class="hd"><span class="grow">自軍の編成</span><span class="pw">戦力 ' + fmt(myPower) + '</span><button class="btn sub" style="min-height:36px;padding:0 10px;font-size:13px" data-act="auto">おまかせ編成</button></div><div class="slots">';
    for (var i = 0; i < 6; i++) {
      if (i >= st.form.length) {
        var needHq = 1; while (TF.slotsFor(needHq) <= i) needHq++;
        html += '<div class="slot locked">🔒<br>司令部Lv' + needHq + 'で解放</div>';
        continue;
      }
      var f = st.form[i], q = squads[i], mk = matchupMark(f.type, info.enemies);
      var hd = f.hero ? TF.HERO[f.hero] : null;
      html += '<button class="slot" data-act="slot" data-i="' + i + '"><span class="mk ' + mk[0] + '">' + mk[1] + '</span>' + unitSvg(f.type, ALLY_C, 'ic') + '<div class="t">' + TF.UNIT[f.type].name + '</div><div class="p num">戦力 ' + fmt(q.power) + '</div>' +
        (hd ? '<div class="hr"><div class="portrait xs">' + heroSvg(f.hero) + '</div><span>' + hd.name.split(' ')[0] + (hd.fav === f.type ? '★' : '') + '</span></div>' : '<div class="hr none">指揮官なし</div>') + '</button>';
    }
    html += '</div><div class="small" style="margin-top:6px">枠をタップで兵種・指揮官を変更。◎○は敵との相性、★は得意兵種。</div></div>';
    // 勝率
    var wr = getWinRate();
    var wi = wrInfo(wr.winRate);
    var pct = Math.round(wr.winRate * 100);
    var rw = info.reward, first = !cleared;
    html += '<div class="winbox card"><div class="wr"><svg class="c" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15.5" fill="none" stroke="#11160f" stroke-width="4"/>' + (pct > 0 ? '<circle cx="18" cy="18" r="15.5" fill="none" stroke="' + wi[1] + '" stroke-width="4" stroke-linecap="round" stroke-dasharray="' + (pct * 0.974).toFixed(1) + ' 100" transform="rotate(-90 18 18)"/>' : '') + '</svg><div><div class="v num" style="color:' + wi[1] + '">' + pct + '%</div><div class="l" style="color:' + wi[1] + '">' + wi[0] + '</div></div></div>' +
      '<div class="grow rewards"><div class="small">予想勝率(100回の模擬戦より)</div><div style="font-weight:800">勝利報酬' + (first ? ' <span class="pill gold">初回×' + TF.K.firstMul + '</span>' : '') + '</div>' +
      '<div class="row"><span class="cost">' + icoMoney() + fmt(rw.m * (first ? TF.K.firstMul : 1)) + '</span><span class="cost">' + icoSteel() + fmt(rw.s * (first ? TF.K.firstMul : 1)) + '</span></div>' +
      '<div class="small">指揮官EXP +' + fmt(rw.exp) + '(敗北時は半分)</div></div></div>';
    html += '<button class="btn wide big" style="margin-top:12px" data-act="sortie">出撃!</button>';
    if (pct < 40) html += '<div class="tips">' + esc(adviceLine(info)) + '</div>';
    $('scr-sortie').innerHTML = html;
  }
  function adviceLine(info) {
    var cnt = {};
    info.enemies.forEach(function (e) { cnt[e.type] = (cnt[e.type] || 0) + 1; });
    var main = Object.keys(cnt).sort(function (a, b) { return cnt[b] - cnt[a]; })[0];
    var c = counters(main);
    var missing = c.filter(function (t) { return !TF.typeUnlocked(st, t); });
    if (missing.length) return 'ヒント: 敵は' + TF.UNIT[main].name + 'が中心。' + names(c) + 'が有効です。' + TF.BLD[TF.TYPE_BLD[missing[0]]].name + 'を建てよう。';
    return 'ヒント: 敵は' + TF.UNIT[main].name + 'が中心。' + names(c) + 'が有効です。勝てないときは前のステージで稼いで、' + TF.BLD[TF.TYPE_BLD[c[0]]].name + 'や研究所を強化しよう。';
  }
  function openSlot(i, keep) {
    sheetCtx = { kind: 'slot', i: i };
    var f = st.form[i];
    var info = TF.stageInfo(st.sel);
    var html = '<div class="grab"></div><button class="close" data-act="sheet-close" aria-label="閉じる">✕</button><h3>部隊' + (i + 1) + 'の編成</h3>';
    html += '<h2 class="sec">兵種</h2><div class="slots" style="grid-template-columns:repeat(2,1fr)">';
    TF.TYPES.forEach(function (t) {
      var on = TF.typeUnlocked(st, t);
      var q = TF.squadStats(st, t, f.hero);
      var mk = matchupMark(t, info.enemies);
      html += '<button class="slot" style="min-height:96px;background:' + (f.type === t ? '#2f5a4e' : '#1b2a25') + ';border:2px solid ' + (f.type === t ? 'var(--ally)' : '#2f5248') + ';border-radius:12px" data-act="set-type" data-i="' + i + '" data-t="' + t + '"' + (on ? '' : ' disabled') + '>' +
        (on ? '<span class="mk ' + mk[0] + '">' + mk[1] + '</span>' : '') + unitSvg(t, on ? ALLY_C : '#667', 'ic') + '<div class="t">' + TF.UNIT[t].name + '</div>' +
        '<div class="p">' + (on ? '戦力 ' + fmt(q.power) : TF.BLD[TF.TYPE_BLD[t]].name + 'が必要') + '</div></button>';
    });
    html += '</div><h2 class="sec">指揮官</h2><div class="blist">';
    html += '<button class="bitem" data-act="set-hero" data-i="' + i + '" data-h="" style="' + (!f.hero ? 'border-color:var(--ally)' : '') + '"><div class="grow" style="text-align:left"><div class="nm">指揮官なし</div></div>' + (!f.hero ? '<span class="pill blue">選択中</span>' : '') + '</button>';
    TF.HEROES.forEach(function (hd) {
      var h = st.heroes[hd.id];
      if (!h) return;
      var where = -1;
      st.form.forEach(function (x, j) { if (x.hero === hd.id) where = j; });
      var sel = where === i;
      html += '<button class="bitem" data-act="set-hero" data-i="' + i + '" data-h="' + hd.id + '" style="text-align:left;' + (sel ? 'border-color:var(--ally)' : '') + '"><div class="portrait sm">' + heroSvg(hd.id) + '</div><div class="grow"><div class="nm">' + hd.name + ' <span class="pill gold">Lv' + h.lv + '</span></div>' +
        '<div class="small">得意: ' + TF.UNIT[hd.fav].name + (hd.fav === f.type ? ' <b style="color:var(--gold)">★得意兵種</b>' : '') + ' / ' + TF.SKILL[hd.skill].name + '</div></div>' +
        (sel ? '<span class="pill blue">選択中</span>' : where >= 0 ? '<span class="pill">部隊' + (where + 1) + 'から移動</span>' : '') + '</button>';
    });
    html += '</div><button class="btn wide" style="margin-top:14px" data-act="sheet-close">決定</button>';
    openSheet(html, keep);
  }

  // ====== タブ切替 ======
  function show(tab) {
    curTab = tab; st.tab = tab;
    ['base', 'army', 'sortie'].forEach(function (k) { $('scr-' + k).classList.toggle('hidden', k !== tab); });
    Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function (b) { b.classList.toggle('on', b.dataset.tab === tab); });
    render();
    $('main').scrollTop = 0;
  }
  function render() {
    renderTop();
    if (curTab === 'base') renderBase();
    else if (curTab === 'army') renderArmy();
    else renderSortie();
  }

  // ====== 出撃と結果 ======
  function startSortie() {
    var s = st.sel;
    var prep = TF.prepareBattle(st, st.form, s);
    var seed = (Math.random() * 2147483647) | 0;
    var res = TF.simulate(prep.p, prep.e, seed, true);
    st.form = prep.form;
    st.pending = { s: s, win: res.win, timeout: res.timeout, form: prep.form };
    save();
    Battle.play(prep, res, st.speed, finishBattle);
  }
  function finishBattle() {
    var p = st.pending;
    if (!p) return;
    var wasCleared = st.cleared;
    var sum = TF.applyResult(st, p.s, p.win, p.form);
    st.pending = null;
    if (sum.first) st.sel = st.cleared + 1;
    save();
    render();
    showResult(p, sum, wasCleared);
  }
  function showResult(p, sum, wasCleared) {
    var html = '<div class="result">';
    if (p.win) {
      html += '<h2 class="win">勝利!</h2><div class="sub">ステージ' + p.s + ' ' + (sum.first ? '初クリア!' : 'クリア') + '</div>';
      html += '<div class="rlist"><div class="rline">' + icoMoney() + '<span class="grow">資金</span><b class="num">+' + fmt(sum.m) + '</b></div>' +
        '<div class="rline">' + icoSteel() + '<span class="grow">鋼材</span><b class="num">+' + fmt(sum.s) + '</b></div>' +
        (sum.first ? '<div class="small" style="text-align:center">初回クリアボーナスで報酬' + TF.K.firstMul + '倍!</div>' : '') + '</div>';
    } else {
      html += '<h2 class="lose">' + (p.timeout ? '時間切れ' : '敗北…') + '</h2><div class="sub">兵は失われていません。強化して再挑戦しよう。</div>';
    }
    if (sum.heroExp.length) {
      html += '<div class="rlist">' + sum.heroExp.map(function (x) {
        return '<div class="rline"><div class="portrait xs">' + heroSvg(x.id) + '</div><span class="grow">' + TF.HERO[x.id].name + ' <span class="small">EXP +' + fmt(x.gain) + '</span></span>' +
          (x.after > x.before ? '<span class="up">Lv' + x.before + '→' + x.after + '!</span>' : '<span class="small">Lv' + x.after + '</span>') + '</div>';
      }).join('') + '</div>';
    }
    if (!p.win) {
      var farm = bestFarm();
      var info = TF.stageInfo(p.s);
      html += '<div class="card small" style="margin-top:8px;line-height:1.6">' + esc(adviceLine(info)) +

  // ====== 戦闘演出 ======
  var Battle = (function () {
    var wrap, cv, cx, W = 0, H = 0, DPR = 1;
    var B = null, raf = 0, lastTs = 0, bgCanvas = null;
    var PATHS = {};
    var FLIGHT = { inf: 0.16, at: 0.45, tank: 0.22, art: 0.7 };
    function path(t) {
      if (!PATHS[t]) PATHS[t] = UPATH[t].map(function (d) { return new Path2D(d); });
      return PATHS[t];
    }
    function resize() {
      if (!wrap) return;
      var r = wrap.getBoundingClientRect();
      W = Math.max(1, r.width); H = Math.max(1, r.height);
      DPR = Math.min(window.devicePixelRatio || 1, 2.5);
      cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
      cv.style.width = W + 'px'; cv.style.height = H + 'px';
      bgCanvas = null;
      if (B) layout();
    }
    function layout() {
      var top = 70, bot = H - 6, fh = bot - top;
      var S = Math.min(W * 0.25, fh * 0.17, 104);
      B.S = S;
      var gap = Math.min(W * 0.31, S * 1.28);
      [0, 1].forEach(function (side) {
        var list = B.units.filter(function (u) { return u.side === side; });
        var n = list.length, front = Math.min(3, n), back = n - front;
        list.forEach(function (u, i) {
          var row = i < front ? 0 : 1, k = row === 0 ? front : back, j = row === 0 ? i : i - front;
          u.x = W / 2 + (j - (k - 1) / 2) * gap;
          var fy = side === 0 ? (row === 0 ? 0.63 : 0.86) : (row === 0 ? 0.36 : 0.13);
          u.y = top + fh * fy;
        });
      });
    }
    function makeBg() {
      bgCanvas = document.createElement('canvas');
      bgCanvas.width = cv.width; bgCanvas.height = cv.height;
      var g = bgCanvas.getContext('2d');
      g.scale(DPR, DPR);
      var grd = g.createLinearGradient(0, 0, 0, H);
      grd.addColorStop(0, '#3b2f22'); grd.addColorStop(0.45, '#3f4429'); grd.addColorStop(0.55, '#3d4628'); grd.addColorStop(1, '#2c3a22');
      g.fillStyle = grd; g.fillRect(0, 0, W, H);
      var rnd = TF.rngFrom(99);
      for (var i = 0; i < 46; i++) {
        g.fillStyle = 'rgba(' + (rnd() < 0.5 ? '0,0,0' : '255,240,200') + ',' + (0.02 + rnd() * 0.03) + ')';
        g.beginPath(); g.ellipse(rnd() * W, rnd() * H, 10 + rnd() * 40, 4 + rnd() * 10, 0, 0, Math.PI * 2); g.fill();
      }
      g.strokeStyle = 'rgba(150,170,90,.35)'; g.lineWidth = 1.2;
      for (i = 0; i < 90; i++) {
        var gx = rnd() * W, gy = 70 + rnd() * (H - 70);
        g.beginPath(); g.moveTo(gx, gy); g.lineTo(gx - 2, gy - 5); g.moveTo(gx, gy); g.lineTo(gx + 1, gy - 6); g.moveTo(gx, gy); g.lineTo(gx + 3, gy - 4); g.stroke();
      }
      var vg = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75);
      vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.45)');
      g.fillStyle = vg; g.fillRect(0, 0, W, H);
      for (i = 0; i < 9; i++) {
        var x = rnd() * W, y = 80 + rnd() * (H - 100), r = 8 + rnd() * 16;
        g.fillStyle = 'rgba(0,0,0,.18)'; g.beginPath(); g.ellipse(x, y, r, r * 0.45, 0, 0, Math.PI * 2); g.fill();
        g.strokeStyle = 'rgba(255,230,180,.08)'; g.lineWidth = 2; g.beginPath(); g.ellipse(x, y - 1, r, r * 0.45, 0, Math.PI, Math.PI * 2); g.stroke();
      }
      g.strokeStyle = 'rgba(255,240,200,.12)'; g.setLineDash([10, 10]); g.lineWidth = 2;
      g.beginPath(); g.moveTo(0, 70 + (H - 76) * 0.5); g.lineTo(W, 70 + (H - 76) * 0.5); g.stroke(); g.setLineDash([]);
      for (i = 0; i < 26; i++) {
        var sx = (i / 25) * W, sy = 70 + (H - 76) * 0.5 + 20;
        g.fillStyle = '#8d7a52'; g.beginPath(); g.ellipse(sx, sy, 11, 5, 0, 0, Math.PI * 2); g.fill();
        g.fillStyle = '#a99467'; g.beginPath(); g.ellipse(sx, sy - 1.5, 9, 3, 0, 0, Math.PI * 2); g.fill();
      }
    }
    function play(prep, res, speed, cb) {
      wrap = $('bwrap'); cv = $('bcv'); cx = cv.getContext('2d');
      $('battle').classList.remove('hidden');
      var units = [];
      prep.p.forEach(function (q, i) { units.push(mkU(q, 0, i, units.length)); });
      prep.e.forEach(function (q, i) { units.push(mkU(q, 1, i, units.length)); });
      B = { units: units, ev: res.ev, ei: 0, clock: 0, res: res, info: prep.info, speed: speed, cb: cb,
        projs: [], imps: [], parts: [], texts: [], banner: null, shake: 0, buff: [{ atk: -1, arm: -1 }, { atk: -1, arm: -1 }], ending: 0, endT: 0, beams: [], marks: [] };
      setSpeed(speed);
      resize();
      lastTs = 0;
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(frame);
    }
    function mkU(q, side, slot, id) {

        flash: 0, dead: false, deadAt: 0, recoil: 0, lastCast: null, bob: Math.random() * 6 };
    }
    function setSpeed(sp) {
      if (B) B.speed = sp;
      Array.prototype.forEach.call(document.querySelectorAll('#speedSel button'), function (b) { b.classList.toggle('on', +b.dataset.sp === sp); });
    }
    function skip() {
      if (!B || B.ending) return;
      while (B.ei < B.ev.length) applyEventInstant(B.ev[B.ei++]);
      B.imps.forEach(applyImpact);
      B.imps = []; B.projs = []; B.beams = []; B.marks = [];
      B.clock = Math.max(B.clock, B.res.time);
      startEnding();
    }
    function applyEventInstant(ev) {
      if (ev.k === 'atk') { if (!ev.miss) applyImpact({ d: ev.d, dmg: ev.dmg, crit: ev.crit, kill: ev.kill, kind: B.units[ev.s].type, quiet: true }); }
      else if (ev.hits) ev.hits.forEach(function (h) { applyImpact({ d: h.d, dmg: h.dmg, kill: h.kill, kind: 'art', quiet: true }); });
    }
    function startEnding() { B.ending = 1; B.endT = 0; }
    function frame(ts) {
      if (!B) return;
      var dt = lastTs ? Math.min(0.05, (ts - lastTs) / 1000) : 0.016;
      lastTs = ts;
      update(dt);
      draw();
      if (B.ending && B.endT > 1.9) { finish(); return; }
      raf = requestAnimationFrame(frame);
    }
    function finish() {
      var cb = B.cb;
      B = null;
      $('battle').classList.add('hidden');
      cb();
    }
    function update(dtReal) {
      var sp = B.speed, dt = dtReal * sp, fxdt = dtReal * Math.sqrt(sp);
      if (!B.ending) {
        B.clock += dt;
        while (B.ei < B.ev.length && B.ev[B.ei].t <= B.clock) fire(B.ev[B.ei++]);
        for (var i = B.imps.length - 1; i >= 0; i--) {
          if (B.imps[i].at <= B.clock) { applyImpact(B.imps[i]); B.imps.splice(i, 1); }
        }
        if (B.ei >= B.ev.length && !B.imps.length && B.clock >= B.res.time + 0.5) startEnding();
      } else {
        B.endT += dtReal;
      }
      B.projs = B.projs.filter(function (p) { return B.clock < p.t1 + 0.02; });
      B.beams = B.beams.filter(function (b) { b.life -= fxdt; return b.life > 0; });
      B.marks = B.marks.filter(function (m) { return B.clock < m.until; });
      B.parts = B.parts.filter(function (p) {
        p.life -= fxdt; p.x += p.vx * fxdt; p.y += p.vy * fxdt; p.vy += (p.g || 0) * fxdt; p.vx *= 1 - 2 * fxdt;
        return p.life > 0;
      });
      if (B.parts.length > 260) B.parts.splice(0, B.parts.length - 260);
      B.texts = B.texts.filter(function (t) { t.life -= dtReal; t.y -= 34 * dtReal; return t.life > 0; });
      B.units.forEach(function (u) { u.flash = Math.max(0, u.flash - dtReal * 4); u.recoil = Math.max(0, u.recoil - dtReal * 6); });
      B.shake = Math.max(0, B.shake - dtReal * 30);
      if (B.banner) { B.banner.t += dtReal; if (B.banner.t > 1.15) B.banner = null; }
      // ロケット煙
      B.projs.forEach(function (p) {
        if (p.kind === 'at' && Math.random() < 0.7) {
          var q = projPos(p, B.clock);
          if (q) B.parts.push({ x: q.x, y: q.y, vx: (Math.random() - 0.5) * 10, vy: -8, life: 0.5, max: 0.5, r: 3 + Math.random() * 3, c: 'smoke' });

    function fire(ev) {

        var d = B.units[ev.d];

        if (ev.miss) { ox = (Math.random() < 0.5 ? -1 : 1) * (B.S * 0.55 + Math.random() * 14); oy = (Math.random() - 0.5) * 20; }
        s.recoil = 1;

    var fresh = !loaded;
    st = loaded || TF.newState(now());
    if (fresh) { st.flags = {}; st.lastSeen = now(); }
    var away = now() - (st.lastSeen || now());
    TF.settle(st, now());
    curTab = st.tab || 'base';
    show(curTab);
    setInterval(function () { liveBase(); renderTop(); }, 1000);
    setInterval(save, 15000);
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) save();
      else { var a = now() - (st.lastSeen || now()); TF.settle(st, now()); render(); if (a > 10 * 60000 && !Battle.active() && $('modalWrap').classList.contains('hidden')) welcomeBack(a); }
    });
    window.addEventListener('pagehide', save);
    makeTouchIcon();
    if (navigator.storage && navigator.storage.persist) { try { navigator.storage.persist(); } catch (e) { } }
    if (st.pending) {
      // 戦闘の途中で閉じた場合は、結果をそのまま反映する
      finishBattle();
    } else if (fresh) {
      intro();
    } else if (away > 10 * 60000) {
      welcomeBack(away);
    }
    save();
  }
  window.__game = { get state() { return st; }, TF: TF, save: save, render: render };
  boot();
})();
</script>
</body>
</html>
